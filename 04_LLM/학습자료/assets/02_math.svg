<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">점수에서 확률·손실까지: 정답에 따른 비교</title><desc id="desc">위에서 아래로 읽는 네 단계 추적도. 모든 값은 교육용이며 실제 성능 측정이 아니다.</desc><rect width="960" height="700" fill="#f8fafc"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#142536} .title{font-size:27px;font-weight:700} .main{font-size:25px;font-weight:600} .sub{font-size:22px} .note{font-size:19px;fill:#40566b}</style>
<text x="38" y="47" class="title">점수에서 확률·손실까지: 정답에 따른 비교</text>
<rect x="38" y="77" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="77" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="109" class="sub">① 점수: z = (ln 2, 0)</text>
<text x="65" y="147" class="main">지수값 exp(z) = (2, 1)</text>
<text x="65" y="182" class="note">교육용 값 · 자연로그 ln</text>
<path d="M480 207v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="225" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="225" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="257" class="sub">② 합으로 정규화</text>
<text x="65" y="295" class="main">softmax(z) = (2/3, 1/3)</text>
<text x="65" y="330" class="note">분모 2 + 1 = 3 · 확률 합 1</text>
<path d="M480 355v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="373" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="373" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="405" class="sub">③ 첫 후보가 정답</text>
<text x="65" y="443" class="main">손실 = -ln(2/3) ≈ 0.4055</text>
<text x="65" y="478" class="note">정답 확률을 높이면 손실 감소</text>
<rect x="38" y="521" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="521" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="553" class="sub">④ 다른 정답이면?</text>
<text x="65" y="591" class="main">손실 = -ln(1/3) ≈ 1.0986</text>
<text x="65" y="626" class="note">같은 예측도 정답에 따라 손실이 다르다</text>
<text x="38" y="686" class="note">읽는 방향: 위 → 아래 · 관계는 각 행의 설명과 화살표로 구분</text></svg>