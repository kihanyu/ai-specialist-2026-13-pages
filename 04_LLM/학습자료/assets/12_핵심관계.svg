<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">SFT의 유효 정답과 DPO의 상대 점수</title><desc id="desc">교육용 예시. 위에서 아래로 읽으며 각 단계의 값과 조건을 확인한다.</desc>
<rect width="800" height="650" fill="#f8fafc"/>
<style>text{font-family:Malgun Gothic,Noto Sans KR,sans-serif;fill:#172554}.title{font-size:23px;font-weight:700}.main{font-size:21px;font-weight:700}.sub{font-size:18px}</style>
<text x="36" y="46" class="title">SFT의 유효 정답과 DPO의 상대 점수</text>
<rect x="35" y="75" width="730" height="86" rx="12" fill="white" stroke="#94a3b8"/>
<text x="55" y="108" class="main">1. SFT 입력</text>
<text x="55" y="139" class="sub">P0, P1, R0, R1, EOS</text>
<path d="M400 163 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="35" y="181" width="730" height="86" rx="12" fill="white" stroke="#94a3b8"/>
<text x="55" y="214" class="main">2. 한 칸 이동한 labels</text>
<text x="55" y="245" class="sub">무시, R0, R1, EOS, 무시</text>
<path d="M400 269 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="35" y="287" width="730" height="86" rx="12" fill="white" stroke="#94a3b8"/>
<text x="55" y="320" class="main">3. SFT 평균 분모</text>
<text x="55" y="351" class="sub">응답 두 토큰 + 실제 EOS = 3</text>
<line x1="45" y1="383" x2="755" y2="383" stroke="#64748b" stroke-dasharray="6 5"/>
<rect x="35" y="393" width="730" height="86" rx="12" fill="white" stroke="#94a3b8"/>
<text x="55" y="426" class="main">4. DPO: reference 대비 차이</text>
<text x="55" y="457" class="sub">chosen +1 · rejected −1 → d=2</text>
<path d="M400 481 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="35" y="499" width="730" height="86" rx="12" fill="white" stroke="#94a3b8"/>
<text x="55" y="532" class="main">5. β=0.5 → −ln sigmoid(1)</text>
<text x="55" y="563" class="sub">설명용 한 쌍의 loss ≈ 0.313262</text>
<text x="36" y="628" class="sub">교육용 재구성 · 측정 성능·실제 모델 실행 결과가 아님</text></svg>