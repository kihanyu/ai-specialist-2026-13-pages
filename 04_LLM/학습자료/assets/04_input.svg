<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">토큰 번호에서 입력 표현까지: 값과 모양 추적</title><desc id="desc">위에서 아래로 읽는 네 단계 추적도. 모든 값은 교육용이며 실제 성능 측정이 아니다.</desc><rect width="960" height="700" fill="#f8fafc"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#142536} .title{font-size:27px;font-weight:700} .main{font-size:25px;font-weight:600} .sub{font-size:22px} .note{font-size:19px;fill:#40566b}</style>
<text x="38" y="47" class="title">토큰 번호에서 입력 표현까지: 값과 모양 추적</text>
<rect x="38" y="77" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="77" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="109" class="sub">① 원문에서 만든 가상 ID</text>
<text x="65" y="147" class="main">[11, 4, 8, 2, 9, 6]</text>
<text x="65" y="182" class="note">실제 토크나이저 출력이 아닌 교육용 사전</text>
<path d="M480 207v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="225" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="225" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="257" class="sub">② T=3인 첫 학습 창</text>
<text x="65" y="295" class="main">X=[11,4,8] / Y=[4,8,2]</text>
<text x="65" y="330" class="note">T+1개로 다음 토큰 정답 구성</text>
<path d="M480 355v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="373" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="373" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="405" class="sub">③ 배치와 임베딩 조회</text>
<text x="65" y="443" class="main">[B,T]=[2,3] → [2,3,4]</text>
<text x="65" y="478" class="note">E의 모양 [V,C]=[20,4]</text>
<path d="M480 503v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="521" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="521" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="553" class="sub">④ 위치 정보 더하기</text>
<text x="65" y="591" class="main">E[11] + P[0] = (1.1,0.2,2,-1)</text>
<text x="65" y="626" class="note">다음 입력 X는 실수 문맥 표현</text>
<text x="38" y="686" class="note">읽는 방향: 위 → 아래 · 관계는 각 행의 설명과 화살표로 구분</text></svg>