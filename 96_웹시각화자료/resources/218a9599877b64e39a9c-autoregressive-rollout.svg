<svg xmlns="http://www.w3.org/2000/svg" width="720" height="331" viewBox="0 0 720 331" role="img" aria-labelledby="t d"><title id="t">직전 예측값을 다음 입력에 이어 붙인다</title><desc id="d">현재 입력 10, 12, 14에서 모델이 다음 값을 15로 예측했다. 첫 관측 10을 버리고 예측 15를 붙이면 다음 입력은 12, 14, 15다. 실제 미래 관측은 아직 사용하지 않는다.</desc><rect x="1" y="1" width="718" height="329" rx="10" fill="#f8fafc" stroke="#b9c8d9"/><g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#19334f"><text x="24" y="38" font-size="24" font-weight="700">직전 예측값을 다음 입력에 이어 붙인다</text><text x="24" y="65" font-size="15" font-weight="400">같은 한 단계 예측 모델을 반복 사용한다. 숫자는 설명용 예시다.</text><rect x="24" y="84" width="672" height="52" rx="10" fill="#e7efff" stroke="#b9c8d9"/><text x="40" y="107" font-size="16" font-weight="700">첫 번째 입력</text><text x="40" y="128" font-size="16" font-weight="400">관측 [10, 12, 14] → 예측 모델 → 내일 예측 15개</text><text x="351" y="158" font-size="19" font-weight="700">↓</text><rect x="24" y="171" width="672" height="52" rx="10" fill="#fff0df" stroke="#b9c8d9"/><text x="40" y="194" font-size="16" font-weight="700">입력 갱신</text><text x="40" y="215" font-size="16" font-weight="400">맨 앞 10 제거 → 12와 14 유지 → 예측값 15 추가</text><text x="351" y="245" font-size="19" font-weight="700">↓</text><rect x="24" y="258" width="672" height="52" rx="10" fill="#e7f5ee" stroke="#b9c8d9"/><text x="40" y="281" font-size="16" font-weight="700">두 번째 입력</text><text x="40" y="302" font-size="16" font-weight="400">[12, 14, 15] → 같은 예측 모델 → 모레 예측</text></g></svg>
