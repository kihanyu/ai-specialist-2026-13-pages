<text x="585" y="586.0" font-size="24" text-anchor="start" style="fill:#00856A;font-weight:700">대각선: gradient &lt; 0 → 점수를 올리는 방향</text>
<text x="585" y="636.0" font-size="24" text-anchor="start" style="fill:#D55E00;font-weight:700">비대각선: gradient &gt; 0 → 점수를 내리는 방향</text>
