<svg xmlns="http://www.w3.org/2000/svg" width="720" height="293" viewBox="0 0 720 293" role="img" aria-labelledby="title desc">
<title id="title">본 영화에 더 높은 점수를 주면 손실이 작다</title><desc id="desc">본 영화 점수가 2, 후보가 1이면 손실 약 0.313. 동점이면 약 0.693. 두 점수를 뒤집으면 약 1.313이다.</desc>
<rect x="1" y="1" width="718" height="291" rx="10" fill="#f8fafc" stroke="#aebfd4"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="38" text-anchor="start" font-size="24" font-weight="700" fill="#21344e">본 영화에 더 높은 점수를 주면 손실이 작다</text>
<text x="24" y="68" text-anchor="start" font-size="16" font-weight="400" fill="#21344e">같은 사용자의 본 영화와 아직 보지 않은 후보를 비교한다.</text><rect x="24" y="84" width="672" height="47" rx="10" fill="#eaf2ff" stroke="#aebfd4"/><text x="35" y="113" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">의도한 순서</text><text x="225" y="113" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">본 영화 2점 · 후보 1점</text><text x="680" y="113" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">손실 약 0.31</text><rect x="24" y="141" width="672" height="47" rx="10" fill="#e9f8f0" stroke="#aebfd4"/><text x="35" y="170" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">동점</text><text x="225" y="170" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">본 영화 1점 · 후보 1점</text><text x="680" y="170" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">손실 약 0.69</text><rect x="24" y="198" width="672" height="47" rx="10" fill="#fff3e6" stroke="#aebfd4"/><text x="35" y="227" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">순서 뒤집힘</text><text x="225" y="227" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">본 영화 1점 · 후보 2점</text><text x="680" y="227" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">손실 약 1.31</text><text x="24" y="271" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">후보는 비교용이다. 실제로 싫어한다는 뜻은 아니다.</text>
</g>
</svg>
