<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">Agent가 행동을 고르고, 실행기와 MCP가 도구에 연결한다</title><desc id="desc">상단은 근거상태와 예산으로 검색을반복하거나종료하는루프이고, 하단은 host client server의역할이다. MCP는검색정답성이나종료를판정하지않는다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1060" fill="white"/>
<text x="40" y="52" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="32" fill="#172b4d" font-weight="700" text-anchor="start">Agent가 행동을 고르고, 실행기와 MCP가 도구에 연결한다</text>
<text x="40" y="99" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">① Agent loop: 현재 근거·미해결 항목·남은 예산으로 다음 행동 결정</text>
<rect x="40" y="140" width="310" height="145" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="58" y="180" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start">상태</text>
<text x="58" y="225" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">질문 + 출처 있는 근거</text>
<text x="58" y="259" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">미해결 항목 + 실행 이력</text>
<rect x="445" y="140" width="310" height="145" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="463" y="180" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start">행동 선택</text>
<text x="463" y="225" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">충분한가? 더 찾을까?</text>
<text x="463" y="259" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">예산 안에서 도구 선택</text>
<rect x="850" y="140" width="310" height="145" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="868" y="180" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start">도구 실행</text>
<text x="868" y="225" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">입력 검증 → 실제 실행</text>
<text x="868" y="259" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">응답·출처·오류 수집</text>
<path d="M360,213 L432,213" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M765,213 L838,213" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="783" y="179" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">재검색</text>
<rect x="400" y="355" width="405" height="126" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path d="M600,294 L600,342" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="420" y="393" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start">종료</text>
<text x="420" y="433" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">충분하면 근거와 함께 답변</text>
<text x="420" y="464" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">한계 도달이면 부족한 근거 보고</text>
<path d="M1005,293 L1005,523 L195,523 L195,294" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="555" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">결과를 누적해 다시 판단 · 최대 hop / 호출 / 시간 예산 고정</text>
<text x="40" y="624" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">② 연결 구조: MCP는 교환 규격이며 판단 알고리즘은 아니다</text>
<rect x="40" y="665" width="310" height="184" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="58" y="707" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#2563eb" font-weight="700" text-anchor="start">Host</text>
<text x="58" y="752" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">사용자 질문·상태·정책</text>
<text x="58" y="786" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">Agent와 실행 흐름 관리</text>
<rect x="445" y="665" width="310" height="184" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
<text x="463" y="707" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#7c3aed" font-weight="700" text-anchor="start">Client</text>
<text x="463" y="752" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">해당 서버와 메시지 교환</text>
<text x="463" y="786" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">도구 탐색·호출 요청</text>
<rect x="850" y="665" width="310" height="184" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
<text x="868" y="707" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#0f766e" font-weight="700" text-anchor="start">Server</text>
<text x="868" y="752" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">Tool: 검색·API 조회</text>
<text x="868" y="786" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">Resource: 데이터</text>
<text x="868" y="820" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">Prompt: 템플릿</text>
<path d="M360,745 L432,745" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M765,745 L838,745" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M840,810 L765,810" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M435,810 L360,810" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="898" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="middle">요청: 도구 이름 + 검증할 인자     응답: 호출과 연결된 결과</text>
<rect x="40" y="930" width="1115" height="80" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="65" y="964" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#b45309" font-weight="700" text-anchor="start">오해 방지: 호출 요청 생성 ≠ 도구 실행 완료 ≠ 올바른 최종 답변</text>
<text x="65" y="995" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#475569" font-weight="400" text-anchor="start">종료·권한·입력 범위·근거 검증은 애플리케이션이 따로 설계한다.</text>
</svg>