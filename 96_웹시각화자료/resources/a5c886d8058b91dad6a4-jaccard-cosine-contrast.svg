<svg xmlns="http://www.w3.org/2000/svg" width="720" height="266" viewBox="0 0 720 266" role="img" aria-labelledby="title desc">
<title id="title">같은 영화를 봐도 별점 패턴은 다를 수 있다</title><desc id="desc">두 사용자는 A와 B를 모두 평가해서 자카드 유사도가 1이다. 별점 벡터는 [5,1]과 [1,5]라 코사인 유사도는 약 0.38이다.</desc>
<rect x="1" y="1" width="718" height="264" rx="10" fill="#f8fafc" stroke="#bdcadb"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#19334d">같은 영화를 봐도 별점 패턴은 다를 수 있다</text><text x="24" y="65" font-size="15" font-weight="400" text-anchor="start" fill="#19334d">두 사람이 평가한 목록은 같지만, 높게 평가한 영화는 서로 다르다.</text>
<rect x="24" y="84" width="324" height="50" rx="10" fill="#e7efff" stroke="#bdcadb"/><text x="42" y="115" font-size="17" font-weight="700" text-anchor="start" fill="#19334d">사용자 1   A 5점 · B 1점</text><rect x="372" y="84" width="324" height="50" rx="10" fill="#e8f7ef" stroke="#bdcadb"/><text x="390" y="115" font-size="17" font-weight="700" text-anchor="start" fill="#19334d">사용자 2   A 1점 · B 5점</text><rect x="24" y="150" width="324" height="78" rx="10" fill="#e7efff" stroke="#bdcadb"/><text x="42" y="175" font-size="18" font-weight="700" text-anchor="start" fill="#19334d">자카드 유사도: 1</text><text x="42" y="198" font-size="15" font-weight="400" text-anchor="start" fill="#19334d">두 사람 모두 A와 B를 평가했다.</text><text x="42" y="218" font-size="14" font-weight="400" text-anchor="start" fill="#19334d">어떤 영화가 겹치는지만 본다.</text><rect x="372" y="150" width="324" height="78" rx="10" fill="#e8f7ef" stroke="#bdcadb"/><text x="390" y="175" font-size="18" font-weight="700" text-anchor="start" fill="#19334d">코사인 유사도: 약 0.38</text><text x="390" y="198" font-size="15" font-weight="400" text-anchor="start" fill="#19334d">[5, 1]과 [1, 5]의 방향은 다르다.</text><text x="390" y="218" font-size="14" font-weight="400" text-anchor="start" fill="#19334d">입력한 별점 패턴도 비교한다.</text><text x="24" y="250" font-size="15" font-weight="700" text-anchor="start" fill="#19334d">0.38은 취향이 같을 확률이 아니라 벡터를 비교한 값이다.</text>
</g></svg>
