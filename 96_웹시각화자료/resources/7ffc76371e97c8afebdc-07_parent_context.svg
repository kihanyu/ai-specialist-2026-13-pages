<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">작게 검색하고 크게 읽기, 문맥을 보강하기는 다른 조작이다</title>
<desc id="desc">위쪽은 작은 child를 검색해 연결된 parent를 가져오는 방식이다. 아래쪽은 같은 청크에 검색용 prefix를 붙이는 문맥 보강이다. 생성 prefix와 실제 원문 근거를 구분한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#617184"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<text x="40" y="55" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#17324d" text-anchor="start">작게 검색하고 크게 읽기, 문맥을 보강하기는 다른 조작이다</text>
<text x="40" y="99" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2266ab" text-anchor="start">① 검색 단위와 생성에 보여줄 단위를 나누기</text>
<rect x="40" y="125" width="1120" height="380" rx="12" fill="#edf5fc" stroke="#cad6e0" stroke-width="2"/>
<rect x="65" y="185" width="280" height="50" rx="12" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="205" y="218" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">C1: 기간 규칙</text>
<rect x="65" y="250" width="280" height="50" rx="12" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<text x="205" y="283" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">C2: 상품 예외</text>
<rect x="65" y="315" width="280" height="50" rx="12" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="205" y="348" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">C3: 신청 절차</text>
<rect x="65" y="380" width="280" height="50" rx="12" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="205" y="413" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">C4: 처리 일정</text>
<text x="65" y="164" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">각 child: 200토큰</text>
<rect x="420" y="246" width="230" height="110" rx="12" fill="#edf5fc" stroke="#2266ab" stroke-width="2"/>
<text x="535.0" y="284" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2266ab" text-anchor="middle">C2 검색</text>
<text x="535.0" y="323" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">parent_id = P</text>
<path d="M345,275 L412,275" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M650,300 L737,300" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="667" y="281" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">조회</text>
<rect x="745" y="185" width="380" height="245" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="935" y="225" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">P: 800토큰 전체</text>
<text x="770" y="271" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">기간 + 예외 + 신청 + 처리</text>
<text x="770" y="305" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">앞뒤 맥락을 함께 전달</text>
<text x="770" y="339" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">같은 P가 여러 번 검색되어도</text>
<text x="770" y="373" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">한 번만 컨텍스트에 넣는다.</text>
<text x="65" y="472" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">검색 점수는 C2의 관련성이다. 큰 P의 모든 내용이 관련 있다는 뜻은 아니다.</text>
<text x="40" y="552" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="start">② 청크 경계는 그대로 두고 검색 표현을 보강하기</text>
<rect x="40" y="580" width="1120" height="350" rx="12" fill="#edf8f5" stroke="#cad6e0" stroke-width="2"/>
<rect x="65" y="650" width="415" height="130" rx="12" fill="white" stroke="#617184" stroke-width="2"/>
<text x="272.5" y="688" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#617184" text-anchor="middle">원래 청크</text>
<text x="272.5" y="727" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">“매출은 전 분기 대비</text>
<text x="272.5" y="761" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">12% 증가했다.”</text>
<path d="M480,718 L590,718" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="535" y="691" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">보강</text>
<rect x="600" y="625" width="525" height="70" rx="0" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<text x="625" y="654" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">검색용 prefix: 가상기업 A, 2024 Q3</text>
<text x="625" y="682" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">국내 서비스 부문 실적</text>
<rect x="600" y="695" width="525" height="110" rx="0" fill="white" stroke="#0d746e" stroke-width="2"/>
<text x="625" y="738" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">원문 본문: 매출은 전 분기 대비</text>
<text x="625" y="774" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">12% 증가했다.</text>
<text x="65" y="852" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#617184" text-anchor="start">범례: 노란 영역 = 검색 보조 표현 · 흰 영역 = 보존한 원문 본문</text>
<text x="65" y="895" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#aa3542" text-anchor="start">LLM이 만든 prefix는 검증 대상이며, 새로운 사실의 증거가 아니다.</text>
</svg>
