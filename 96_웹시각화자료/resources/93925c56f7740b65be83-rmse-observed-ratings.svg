<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308" role="img" aria-labelledby="title desc">
<title id="title">평가용 별점이 있는 칸에서만 오차를 잰다</title><desc id="desc">가의 A와 나의 C는 평가용으로 가린 관측 평점이다. 오차 크기 1과 2를 제곱해 평균하고 제곱근을 취하면 1.58점이다. 가의 C는 원래 미관측이므로 제외한다.</desc>
<rect x="1" y="1" width="718" height="306" rx="10" fill="#f8fafc" stroke="#bdcadb"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#19334d">평가용 별점이 있는 칸에서만 오차를 잰다</text><text x="24" y="65" font-size="15" font-weight="400" text-anchor="start" fill="#19334d">제곱근 평균 제곱 오차(RMSE) 예시 · 모델이 보지 못한 평가용 별점 2건</text>
<rect x="24" y="85" width="672" height="44" rx="10" fill="#e7efff" stroke="#bdcadb"/><text x="42" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#19334d">‘가’의 A</text><text x="188" y="112" font-size="16" font-weight="400" text-anchor="start" fill="#19334d">실제 5점 → 예측 4점</text><text x="540" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#19334d">오차 1점</text><rect x="24" y="138" width="672" height="44" rx="10" fill="#e8f7ef" stroke="#bdcadb"/><text x="42" y="165" font-size="16" font-weight="700" text-anchor="start" fill="#19334d">‘나’의 C</text><text x="188" y="165" font-size="16" font-weight="400" text-anchor="start" fill="#19334d">실제 4점 → 예측 2점</text><text x="540" y="165" font-size="16" font-weight="700" text-anchor="start" fill="#19334d">오차 2점</text><rect x="24" y="199" width="672" height="58" rx="10" fill="#fff0df" stroke="#bdcadb"/><text x="42" y="223" font-size="18" font-weight="700" text-anchor="start" fill="#19334d">제곱: 1과 4   →   평균: 2.5   →   제곱근: 약 1.58점</text><text x="42" y="245" font-size="14" font-weight="400" text-anchor="start" fill="#19334d">2점 틀린 경우가 1점 틀린 경우보다 더 크게 반영된다.</text><text x="24" y="286" font-size="15" font-weight="700" text-anchor="start" fill="#19334d">‘가’의 C처럼 원래 실제 별점이 없던 칸은 평가에서 제외한다.</text>
</g></svg>
