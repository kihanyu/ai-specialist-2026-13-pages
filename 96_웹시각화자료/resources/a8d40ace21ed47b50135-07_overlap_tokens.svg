<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">Overlap은 경계를 보완하지만 중복 토큰을 저장한다</title>
<desc id="desc">길이 1000토큰, 청크 400토큰, overlap 100토큰이다. 시작점 0,300,600에서 세 청크가 만들어지며 두 중복 구간의 합은 200토큰이다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#617184"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<text x="40" y="55" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#17324d" text-anchor="start">Overlap은 경계를 보완하지만 중복 토큰을 저장한다</text>
<text x="40" y="98" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#617184" text-anchor="start">같은 토크나이저 기준 · 청크 크기 400 · 겹침 100 · 시작 간격 300토큰</text>
<text x="40" y="193" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">원본</text>
<rect x="150" y="158" width="950" height="48" rx="0" fill="#edf5fc" stroke="#cad6e0" stroke-width="2"/>
<path d="M150.0,208 L150.0,222" fill="none" stroke="#617184" stroke-width="2" stroke-linejoin="round"/>
<text x="150.0" y="249" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#17324d" text-anchor="middle">0</text>
<path d="M435.0,208 L435.0,222" fill="none" stroke="#617184" stroke-width="2" stroke-linejoin="round"/>
<text x="435.0" y="249" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#17324d" text-anchor="middle">300</text>
<path d="M530.0,208 L530.0,222" fill="none" stroke="#617184" stroke-width="2" stroke-linejoin="round"/>
<text x="530.0" y="249" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#17324d" text-anchor="middle">400</text>
<path d="M720.0,208 L720.0,222" fill="none" stroke="#617184" stroke-width="2" stroke-linejoin="round"/>
<text x="720.0" y="249" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#17324d" text-anchor="middle">600</text>
<path d="M815.0,208 L815.0,222" fill="none" stroke="#617184" stroke-width="2" stroke-linejoin="round"/>
<text x="815.0" y="249" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#17324d" text-anchor="middle">700</text>
<path d="M1100.0,208 L1100.0,222" fill="none" stroke="#617184" stroke-width="2" stroke-linejoin="round"/>
<text x="1100.0" y="249" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#17324d" text-anchor="middle">1000</text>
<rect x="435.0" y="158" width="95.0" height="48" rx="0" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<rect x="720.0" y="158" width="95.0" height="48" rx="0" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<text x="40" y="336" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">C1</text>
<rect x="150.0" y="300" width="380.0" height="58" rx="0" fill="#edf5fc" stroke="#2266ab" stroke-width="2"/>
<rect x="435.0" y="300" width="95.0" height="58" rx="0" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<text x="340.0" y="338" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">[0, 400) : 400토큰</text>
<text x="40" y="436" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">C2</text>
<rect x="435.0" y="400" width="380.0" height="58" rx="0" fill="#edf5fc" stroke="#2266ab" stroke-width="2"/>
<rect x="435.0" y="400" width="95.0" height="58" rx="0" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<rect x="720.0" y="400" width="95.0" height="58" rx="0" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<text x="625.0" y="438" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">[300, 700) : 400토큰</text>
<text x="40" y="536" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">C3</text>
<rect x="720.0" y="500" width="380.0" height="58" rx="0" fill="#edf5fc" stroke="#2266ab" stroke-width="2"/>
<rect x="720.0" y="500" width="95.0" height="58" rx="0" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<text x="910.0" y="538" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">[600, 1000) : 400토큰</text>
<text x="40" y="606" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#617184" text-anchor="start">범례: 파란 칸 = 일반 범위 · 노란 칸 = 이웃 청크에도 저장되는 100토큰</text>
<rect x="40" y="650" width="350" height="115" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="215.0" y="688" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">청크 수: 3개</text>
<text x="215.0" y="727" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">원본 길이: 1,000토큰</text>
<rect x="425" y="650" width="350" height="115" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="600.0" y="688" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">저장량: 1,200토큰</text>
<text x="600.0" y="727" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">400 + 400 + 400</text>
<rect x="810" y="650" width="350" height="115" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="985.0" y="688" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">중복량: 200토큰</text>
<text x="985.0" y="727" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">[300,400) + [600,700)</text>
</svg>
