<svg xmlns="http://www.w3.org/2000/svg" width="720" height="293" viewBox="0 0 720 293" role="img" aria-labelledby="title desc">
<title id="title">연결 수에 따라 받은 정보의 비중을 조정한다</title><desc id="desc">u0의 자기 연결 포함 차수는 2, i0의 차수는 3이다. u0의 값 2에서 1을 반영하고 이웃 값 3에서 약 1.22를 반영한다.</desc>
<rect x="1" y="1" width="718" height="291" rx="10" fill="#f8fafc" stroke="#aebfd4"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="38" text-anchor="start" font-size="24" font-weight="700" fill="#21344e">연결 수에 따라 받은 정보의 비중을 조정한다</text>
<text x="24" y="68" text-anchor="start" font-size="16" font-weight="400" fill="#21344e">자기 연결을 센다: 받는 u0은 차수 2, 이웃 i0은 차수 3.</text><rect x="24" y="84" width="672" height="47" rx="10" fill="#eaf2ff" stroke="#aebfd4"/><text x="35" y="113" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">자기 정보 · 값 2</text><text x="225" y="113" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">차수 2와 2 → 비중 0.50</text><text x="680" y="113" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">1.00</text><rect x="24" y="141" width="672" height="47" rx="10" fill="#e9f8f0" stroke="#aebfd4"/><text x="35" y="170" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">이웃 정보 · 값 3</text><text x="225" y="170" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">차수 2와 3 → 비중 약 0.41</text><text x="680" y="170" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">약 1.22</text><rect x="24" y="198" width="672" height="47" rx="10" fill="#fff3e6" stroke="#aebfd4"/><text x="35" y="227" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">u0에 모인 값</text><text x="225" y="227" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">자기 정보와 이웃 정보를 더함</text><text x="680" y="227" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">약 2.22</text><text x="24" y="271" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">양쪽 차수가 클수록 각 연결의 비중이 작아진다.</text>
</g>
</svg>
