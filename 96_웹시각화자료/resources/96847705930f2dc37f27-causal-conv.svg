<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">합성곱의 간격이 읽는 시점을 바꾼다</title><desc id="desc">폭 3, stride 1이며 현재 시점 t까지 허용한다.. dilation 1 t−2, t−1, t 연속 3개 · 수용 범위 3. dilation 2 t−4, t−2, t 간격 2 · 수용 범위 5. 두 층을 차례로 결합 t−6부터 t까지 · 범위 7 두 번째 층의 각 입력이 첫 번째 층의 과거 3칸을 참조한다.. t+1 이후는 참조하지 않는다. 현재값도 금지하려면 한 칸 이동한다.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">합성곱의 간격이 읽는 시점을 바꾼다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">폭 3, stride 1이며 현재 시점 t까지 허용한다.</text><rect x="24" y="84" width="324" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">dilation 1</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">t−2, t−1, t</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">연속 3개 · 수용 범위 3</text><rect x="372" y="84" width="324" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="383" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">dilation 2</text><text x="383" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">t−4, t−2, t</text><text x="383" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">간격 2 · 수용 범위 5</text><rect x="24" y="170" width="672" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">두 층을 차례로 결합</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">t−6부터 t까지 · 범위 7</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">두 번째 층의 각 입력이 첫 번째 층의 과거 3칸을 참조한다.</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">t+1 이후는 참조하지 않는다. 현재값도 금지하려면 한 칸 이동한다.</text>
</g>
</svg>
