<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">검색의 누락과 답변의 근거 이탈은 다른 분모로 측정한다</title><desc id="desc">가상환불정책의 정답기준은 기한 신청방법 영업일기준처리기간3개이다. 검색에는기한과방법2개만있어 contextrecall2/3이다. 답변은기한과방법에근거없는수수료를추가해faithfulness2/3이다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="870" fill="white"/>
<text x="40" y="52" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="32" fill="#172b4d" font-weight="700" text-anchor="start">검색의 누락과 답변의 근거 이탈은 다른 분모로 측정한다</text>
<text x="40" y="99" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">가상 정책 · A: 14일 이내 / B: 주문 화면 신청 / C: 영업일 3~5일 처리</text>
<rect x="40" y="145" width="310" height="265" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="58" y="188" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start">정답 기준 reference</text>
<rect x="55" y="225" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="68" y="255" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">A  기한 14일</text>
<rect x="55" y="283" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="68" y="313" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">B  주문 화면 신청</text>
<rect x="55" y="341" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="68" y="371" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="700" text-anchor="start">C  영업일 3~5일 처리</text>
<rect x="445" y="145" width="310" height="265" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
<text x="463" y="188" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#0f766e" font-weight="700" text-anchor="start">검색 컨텍스트</text>
<rect x="460" y="225" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="473" y="255" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">A  기한 14일</text>
<rect x="460" y="283" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="473" y="313" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">B  주문 화면 신청</text>
<rect x="460" y="341" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="473" y="371" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#b91c1c" font-weight="700" text-anchor="start">C  없음: 검색 누락</text>
<rect x="850" y="145" width="310" height="265" rx="12" fill="#f8fafc" stroke="#b45309" stroke-width="2"/>
<text x="868" y="188" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#b45309" font-weight="700" text-anchor="start">생성 답변</text>
<rect x="865" y="225" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="878" y="255" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">A  기한 14일</text>
<rect x="865" y="283" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="878" y="313" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="400" text-anchor="start">B  주문 화면 신청</text>
<rect x="865" y="341" width="280" height="44" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="878" y="371" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#b91c1c" font-weight="700" text-anchor="start">X  수수료 1,000원</text>
<rect x="40" y="458" width="515" height="216" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="499" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#2563eb" font-weight="700" text-anchor="start">검색: Context Recall</text>
<text x="65" y="544" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">정답 기준 주장 3개 중</text>
<text x="65" y="587" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">검색 근거가 지원하는 주장 2개</text>
<text x="65" y="630" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">CR = 2 / 3</text>
<rect x="645" y="458" width="515" height="216" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="670" y="499" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#b45309" font-weight="700" text-anchor="start">생성: Faithfulness</text>
<text x="670" y="544" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">생성 답변 주장 3개 중</text>
<text x="670" y="587" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">검색 근거가 지원하는 주장 2개</text>
<text x="670" y="630" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="400" text-anchor="start">F = 2 / 3</text>
<path d="M190,417 L190,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1005,417 L1005,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="715" width="1120" height="105" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="751" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">같은 2/3이라도 고칠 곳은 다르다.</text>
<text x="65" y="792" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">검색은 C를 더 찾아야 하고, 생성은 근거 없는 X를 빼거나 따로 검증해야 한다.</text>
</svg>