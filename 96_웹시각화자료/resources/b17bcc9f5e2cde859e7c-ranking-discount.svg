<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">적중 수가 같아도 앞에 놓을수록 유리하다</title><desc id="desc">K = 3 · 관련 영화는 A, C, D · 실험의 관련성은 0 또는 1. 1위 B 비적합 → 0 . 2위 A 적합 → 1/log₂(3) DCG ≈ 0.631. 3위 E 비적합 → 0 NDCG ≈ 0.296. 1위 A 적합 → 1/log₂(2) DCG = 1. 2위 B 비적합 → 0 . 3위 E 비적합 → 0 NDCG ≈ 0.469. Precision과 Recall은 둘 다 1/3, IDCG는 약 2.131로 고정.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">적중 수가 같아도 앞에 놓을수록 유리하다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">K = 3 · 관련 영화는 A, C, D · 실험의 관련성은 0 또는 1</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">1위 B</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">비적합 → 0</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start"></text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">2위 A</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">적합 → 1/log₂(3)</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">DCG ≈ 0.631</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">3위 E</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">비적합 → 0</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">NDCG ≈ 0.296</text><rect x="24" y="170" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">1위 A</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">적합 → 1/log₂(2)</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">DCG = 1</text><rect x="256" y="170" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">2위 B</text><text x="267" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">비적합 → 0</text><text x="267" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start"></text><rect x="488" y="170" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">3위 E</text><text x="499" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">비적합 → 0</text><text x="499" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">NDCG ≈ 0.469</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">Precision과 Recall은 둘 다 1/3, IDCG는 약 2.131로 고정.</text>
</g>
</svg>
