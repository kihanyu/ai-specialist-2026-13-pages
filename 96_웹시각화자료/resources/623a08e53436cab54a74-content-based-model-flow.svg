<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504" role="img" aria-labelledby="title desc">
<title id="title">영화 콘텐츠로 사용자별 추천 순위를 만드는 흐름</title>
<desc id="desc">사용자 기록의 A와 B, 후보 영화 E와 F를 같은 영화 인코더로 표현한다. A와 B의 벡터를 평균해 취향을 만들고 후보 벡터와 코사인 유사도를 비교한다. 모험 영화 E가 다큐 F보다 높은 점수를 받는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#516780"/></marker></defs>
<rect x="1" y="1" width="718" height="502" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#172c45">
<text x="24" y="38" font-size="24" font-weight="700">같은 영화 인코더로 취향과 후보를 비교한다</text>
<text x="24" y="65" font-size="15">사용자 ‘가’의 예 · 벡터의 두 칸은 순서대로 모험과 다큐</text>
<g stroke="#516780" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M181 142V163"/><path d="M539 142V163"/>
<path d="M181 220V243"/><path d="M539 220V243"/>
<path d="M181 318V335H260V352"/><path d="M539 318V335H460V352"/>
<path d="M360 415V434"/>
</g>
<rect x="24" y="82" width="314" height="60" rx="10" fill="#e7efff" stroke="#a2b9df"/>
<rect x="382" y="82" width="314" height="60" rx="10" fill="#e4f5ed" stroke="#99c5b0"/>
<rect x="24" y="163" width="672" height="57" rx="10" fill="#edf1f8" stroke="#afbed2"/>
<rect x="24" y="243" width="314" height="75" rx="10" fill="#e7efff" stroke="#a2b9df"/>
<rect x="382" y="243" width="314" height="75" rx="10" fill="#e4f5ed" stroke="#99c5b0"/>
<rect x="153" y="352" width="414" height="63" rx="10" fill="#fff0de" stroke="#d6b788"/>
<rect x="153" y="434" width="414" height="48" rx="10" fill="#e2edff" stroke="#a2b9df"/>
<g font-size="17" font-weight="700" text-anchor="middle">
<text x="181" y="106">취향에 참고할 영화 A와 B</text><text x="539" y="106">아직 보지 않은 후보 E와 F</text>
<text x="360" y="187">공유 영화 인코더: 양쪽 영화를 같은 규칙으로 표현</text>
<text x="181" y="269">A [1, 0] · B [1, 1]</text><text x="539" y="269">E [1, 0] · F [0, 1]</text>
<text x="360" y="377">취향 벡터와 각 후보의 코사인 유사도</text>
<text x="360" y="464">추천 순위: 1위 모험 영화 E → 2위 다큐 영화 F</text>
</g>
<g font-size="15" text-anchor="middle">
<text x="181" y="130">사용자의 과거 기록에서 고른다</text><text x="539" y="130">추천할 수 있는 영화에서 고른다</text>
<text x="360" y="207">기본형은 장르를 숫자로 표시한다</text>
<text x="181" y="297">두 벡터를 평균 → 취향 [1, 0.5]</text><text x="539" y="297">후보 벡터는 영화별로 유지</text>
<text x="360" y="401">E 약 0.89 · F 약 0.45</text>
</g></g></svg>
