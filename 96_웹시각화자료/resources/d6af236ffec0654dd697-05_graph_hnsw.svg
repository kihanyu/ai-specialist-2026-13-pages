<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">후보 폭으로 경로를 남기고, 계층으로 시작점을 찾는다</title><desc id="desc">왼쪽: 폭 L=1과 L=2 / 오른쪽: HNSW의 상위층 → 하위층 탐색</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526175"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#172B4D} .note{fill:#526175}</style>
<rect width="1200" height="830" fill="white"/>
<text x="30" y="48.0" font-size="32" text-anchor="start" style="fill:#172B4D;font-weight:700">후보 폭으로 경로를 남기고, 계층으로 시작점을 찾는다</text>
<text x="30" y="92.0" font-size="24" text-anchor="start" style="fill:#526175;font-weight:400">왼쪽: 폭 L=1과 L=2 / 오른쪽: HNSW의 상위층 → 하위층 탐색</text>
<text x="35" y="150.0" font-size="25" text-anchor="start" style="fill:#0072B2;font-weight:700">후보를 하나만 남기면 우회로를 잃는다.</text>
<line x1="142.26326900629988" y1="278.6192349134192" x2="318.84197827851443" y2="237.29230295609236" stroke="#CFD8E3" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="135.14324089728746" y1="304.4486463835879" x2="236.97915326024292" y2="402.77297556161386" stroke="#CFD8E3" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="322.7367309937001" y1="236.38076508658082" x2="146.15802172148557" y2="277.7076970439076" stroke="#CFD8E3" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="288.0" y1="425.0" x2="443.0" y2="425.0" stroke="#CFD8E3" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="447.0" y1="425.0" x2="292.0" y2="425.0" stroke="#CFD8E3" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="115" cy="285" r="29" fill="#0072B2" stroke="white" stroke-width="2"/>
<text x="115" y="294.0" font-size="26" text-anchor="middle" style="fill:white;font-weight:700">A</text>
<text x="115" y="237.0" font-size="24" text-anchor="middle" style="fill:#172B4D;font-weight:400">거리 2</text>
<circle cx="350" cy="230" r="29" fill="#0072B2" stroke="white" stroke-width="2"/>
<text x="350" y="239.0" font-size="26" text-anchor="middle" style="fill:white;font-weight:700">B</text>
<text x="350" y="182.0" font-size="24" text-anchor="middle" style="fill:#172B4D;font-weight:400">거리 1</text>
<circle cx="260" cy="425" r="29" fill="#0072B2" stroke="white" stroke-width="2"/>
<text x="260" y="434.0" font-size="26" text-anchor="middle" style="fill:white;font-weight:700">C</text>
<text x="260" y="377.0" font-size="24" text-anchor="middle" style="fill:#172B4D;font-weight:400">거리 1.5</text>
<circle cx="475" cy="425" r="29" fill="#00856A" stroke="white" stroke-width="2"/>
<text x="475" y="434.0" font-size="26" text-anchor="middle" style="fill:white;font-weight:700">D</text>
<text x="475" y="377.0" font-size="24" text-anchor="middle" style="fill:#172B4D;font-weight:400">거리 0.1</text>
<text x="35" y="540.0" font-size="24" text-anchor="start" style="fill:#D55E00;font-weight:700">L=1: A → B → 종료, D를 놓침</text>
<text x="35" y="587.0" font-size="23" text-anchor="start" style="fill:#00856A;font-weight:700">L=2: B와 C 보존 → C 확장 → D 발견</text>
<text x="35" y="635.0" font-size="23" text-anchor="start" style="fill:#172B4D;font-weight:400">질의 q=(0,0)까지의 거리를 표시했다.</text>
<text x="35" y="674.0" font-size="22" text-anchor="start" style="fill:#526175;font-weight:400">배치는 연결 구조를 보여 주며 좌표축은 아니다.</text>
<line x1="600" y1="135" x2="600" y2="720" stroke="#CFD8E3" stroke-width="2"/>
<text x="635" y="150.0" font-size="25" text-anchor="start" style="fill:#7956A5;font-weight:700">HNSW: 성긴 층에서 찾고 아래로 내려간다.</text>
<rect x="640" y="180" width="530" height="175" rx="12" fill="#F2F6FA" stroke="#CFD8E3" stroke-width="2"/>
<text x="660" y="222.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:700">상위층: 적은 노드</text>
<rect x="640" y="425" width="530" height="175" rx="12" fill="#F2F6FA" stroke="#CFD8E3" stroke-width="2"/>
<text x="660" y="467.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:700">하위층: 많은 노드</text>
<line x1="700" y1="280" x2="900" y2="250" stroke="#CFD8E3" stroke-width="3"/>
<line x1="900" y1="250" x2="1100" y2="280" stroke="#CFD8E3" stroke-width="3"/>
<circle cx="700" cy="280" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<circle cx="900" cy="250" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<circle cx="1100" cy="280" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<line x1="680" y1="530" x2="770" y2="490" stroke="#CFD8E3" stroke-width="3"/>
<line x1="770" y1="490" x2="860" y2="550" stroke="#CFD8E3" stroke-width="3"/>
<line x1="860" y1="550" x2="940" y2="505" stroke="#CFD8E3" stroke-width="3"/>
<line x1="940" y1="505" x2="1030" y2="550" stroke="#CFD8E3" stroke-width="3"/>
<line x1="1030" y1="550" x2="1120" y2="495" stroke="#CFD8E3" stroke-width="3"/>
<circle cx="680" cy="530" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<circle cx="770" cy="490" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<circle cx="860" cy="550" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<circle cx="940" cy="505" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<circle cx="1030" cy="550" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<circle cx="1120" cy="495" r="12" fill="#7956A5" stroke="white" stroke-width="2"/>
<line x1="700" y1="280" x2="900" y2="250" stroke="#7956A5" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="900" y1="267" x2="940" y2="485" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
<text x="970" y="375.0" font-size="23" text-anchor="start" style="fill:#D55E00;font-weight:400">동일 노드로 하강</text>
<line x1="940" y1="505" x2="1030" y2="550" stroke="#00856A" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1030" y1="550" x2="1120" y2="495" stroke="#00856A" stroke-width="4" marker-end="url(#arrow)"/>
<text x="635" y="635.0" font-size="23" text-anchor="start" style="fill:#172B4D;font-weight:400">상위층의 결과가 아래층의 시작점이 된다.</text>
<text x="635" y="674.0" font-size="23" text-anchor="start" style="fill:#172B4D;font-weight:400">후보 폭은 반환 수 K와 별도 설정이다.</text>
<rect x="30" y="755" width="1140" height="52" rx="12" fill="#F2F6FA" stroke="#CFD8E3" stroke-width="2"/>
<text x="45" y="790.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:400">기억할 것: 후보 폭을 늘리면 더 찾을 기회가 생기지만 exact Top-K를 보장하지는 않는다.</text>
</svg>