<svg xmlns="http://www.w3.org/2000/svg" width="760" height="282" viewBox="0 0 760 282" role="img" aria-labelledby="title desc">
  <title id="title">관측 6개에서 입력 3개와 라벨 2개를 고르는 두 윈도우</title>
  <desc id="desc">첫 행의 값은 10, 12, 14, 16, 18, 20개다. 첫째 창은 시점 1에서 3을 입력, 4에서 5를 라벨로 사용한다. 둘째 창은 시점 2에서 4를 입력, 5에서 6을 라벨로 사용한다.</desc>
  <rect x="1" y="1" width="758" height="280" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#172554">
    <text x="28" y="37" font-size="22" font-weight="700">입력 끝 다음부터 미래 라벨을 붙인다</text>
    <text x="28" y="65" font-size="15">예시 관측 6개 · 입력 3시점 · 라벨 2시점 · 왼쪽에서 오른쪽으로 시간 진행</text>
    <g text-anchor="middle" font-size="16" font-weight="700">
      <text x="28" y="109" text-anchor="start">시점</text>
      <text x="187" y="109">1</text><text x="284" y="109">2</text><text x="381" y="109">3</text>
      <text x="478" y="109">4</text><text x="575" y="109">5</text><text x="672" y="109">6</text>
      <text x="28" y="139" text-anchor="start">관측값 (개)</text>
      <text x="187" y="139">10</text><text x="284" y="139">12</text><text x="381" y="139">14</text>
      <text x="478" y="139">16</text><text x="575" y="139">18</text><text x="672" y="139">20</text>
    </g>
    <path d="M139 153H720" stroke="#94a3b8"/>
    <rect x="139" y="169" width="288" height="37" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="431" y="169" width="192" height="37" rx="6" fill="#ffedd5" stroke="#b45309" stroke-dasharray="5 2"/>
    <rect x="236" y="222" width="288" height="37" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="528" y="222" width="192" height="37" rx="6" fill="#ffedd5" stroke="#b45309" stroke-dasharray="5 2"/>
    <g font-size="16" font-weight="700">
      <text x="28" y="193">첫째 창</text><text x="28" y="246">둘째 창</text>
      <text x="283" y="193" text-anchor="middle">입력 1–3</text><text x="527" y="193" text-anchor="middle" fill="#78350f">라벨 4–5</text>
      <text x="380" y="246" text-anchor="middle">입력 2–4</text><text x="624" y="246" text-anchor="middle" fill="#78350f">라벨 5–6</text>
    </g>
  </g>
</svg>
