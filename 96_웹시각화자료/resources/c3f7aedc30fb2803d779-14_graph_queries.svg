<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">그래프 모델과 OPTIONAL의 바인딩</title><rect width="960" height="440" fill="#f6f8fc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#2463a6"/></marker></defs><g font-family="Malgun Gothic,sans-serif" font-size="19" fill="#23364d"><rect x="35" y="45" width="390" height="90" rx="7" fill="white" stroke="#2463a6" stroke-width="3"/><text x="50" y="79">RDF: (Alice, worksAt, Lab)</text><rect x="500" y="45" width="425" height="90" rx="7" fill="white" stroke="#2463a6" stroke-width="3"/><text x="515" y="79">Property graph: Person → Company</text><rect x="35" y="190" width="265" height="60" rx="7" fill="white" stroke="#2463a6" stroke-width="3"/><text x="50" y="224">Alice: email 두 개</text><rect x="35" y="280" width="265" height="60" rx="7" fill="white" stroke="#2463a6" stroke-width="3"/><text x="50" y="314">Bob: email 없음</text><path d="M300 220L430 220" stroke="#2463a6" stroke-width="3" marker-end="url(#arrow)"/><text x="325.0" y="208.0">OPTIONAL</text><rect x="430" y="180" width="495" height="70" rx="7" fill="white" stroke="#2463a6" stroke-width="3"/><text x="445" y="214">Alice/a1, Alice/a2 — 두 바인딩</text><path d="M300 310L430 310" stroke="#2463a6" stroke-width="3" marker-end="url(#arrow)"/><text x="325.0" y="298.0"></text><rect x="430" y="280" width="495" height="70" rx="7" fill="white" stroke="#7546a5" stroke-width="3"/><text x="445" y="314">Bob/미바인딩 — 왼쪽 행 보존</text><text x="40" y="405">그래프 사실의 집합과 질의 결과의 행 중복은 서로 다른 의미</text></g></svg>