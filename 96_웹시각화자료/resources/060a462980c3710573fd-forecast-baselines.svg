<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img" aria-labelledby="title desc">
<title id="title">같은 입력에서 기준 예측을 나란히 비교한다</title><desc id="desc">과거 관측은 [10, 12, 14]개. 다음 한 시점만 예측한다.. 마지막 값 마지막 관측 14 예측 14개. 평균 (10 + 12 + 14) / 3 예측 12개. 계절 길이 2 같은 위상의 값 12 예측 12개. 평균법과 계절법의 값이 같은 것은 이 예의 우연이다.</desc>
<rect x="1" y="1" width="718" height="212" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">같은 입력에서 기준 예측을 나란히 비교한다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">과거 관측은 [10, 12, 14]개. 다음 한 시점만 예측한다.</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">마지막 값</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">마지막 관측 14</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예측 14개</text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">평균</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">(10 + 12 + 14) / 3</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예측 12개</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">계절 길이 2</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">같은 위상의 값 12</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예측 12개</text><text x="24" y="198" font-size="15" font-weight="700" fill="#244263" text-anchor="start">평균법과 계절법의 값이 같은 것은 이 예의 우연이다.</text>
</g>
</svg>
