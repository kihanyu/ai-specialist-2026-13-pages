<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img" aria-labelledby="title desc">
<title id="title">훈련 기록과 평가 정답을 분리한다</title><desc id="desc">사용자 U가 훈련에서 본 영화는 F, 평가에서 선호한 영화는 A·C·D다.. 훈련에서 본 항목 F 훈련 그래프에 사용. 새 영화 후보 A · B · C · D · E 모델이 점수를 생성. 평가 정답 A · C · D 점수 생성 뒤 대조. 새 영화 추천을 평가할 때는 F를 후보에서 뺀다.</desc>
<rect x="1" y="1" width="718" height="212" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">훈련 기록과 평가 정답을 분리한다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">사용자 U가 훈련에서 본 영화는 F, 평가에서 선호한 영화는 A·C·D다.</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">훈련에서 본 항목</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">F</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">훈련 그래프에 사용</text><text x="244" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">새 영화 후보</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">A · B · C · D · E</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">모델이 점수를 생성</text><text x="476" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">평가 정답</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">A · C · D</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">점수 생성 뒤 대조</text><text x="24" y="198" font-size="15" font-weight="700" fill="#244263" text-anchor="start">새 영화 추천을 평가할 때는 F를 후보에서 뺀다.</text>
</g>
</svg>
