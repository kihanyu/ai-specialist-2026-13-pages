<text x="918" y="477" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">CP@5 =</text>
<text x="918" y="514" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#0f766e" font-weight="700" text-anchor="start">1.000000</text>
<rect x="40" y="610" width="1110" height="135" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="65" y="650" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="700" text-anchor="start">A: CP = (1 + 2/3 + 3/5) / 3 ≈ 0.755556</text>
<text x="65" y="689" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="700" text-anchor="start">B: CP = (1 + 1 + 1) / 3 = 1</text>
<text x="65" y="725" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#475569" font-weight="400" text-anchor="start">분모는 Top-5 안의 관련 청크 3개. CP=1이어도 뒤에 노이즈가 있을 수 있다.</text>
