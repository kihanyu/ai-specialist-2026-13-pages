<text x="470" y="378" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">3위</text>
<rect x="405" y="392" width="130" height="75" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="440" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">관련</text>
<text x="470" y="505" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">P@3</text>
<text x="470" y="539" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">1.000</text>
<text x="620" y="378" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">4위</text>
<rect x="555" y="392" width="130" height="75" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="620" y="440" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#475569" font-weight="700" text-anchor="middle">무관</text>
<text x="620" y="505" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">P@4</text>
