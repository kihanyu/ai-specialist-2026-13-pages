<text x="770" y="271" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">P@5</text>
<text x="770" y="305" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">0.600</text>
<rect x="895" y="158" width="255" height="150" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="918" y="197" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#172b4d" font-weight="700" text-anchor="start">P@5 = 3/5 = 0.6</text>
<text x="918" y="243" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#172b4d" font-weight="400" text-anchor="start">CP@5 =</text>
<text x="918" y="280" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#0f766e" font-weight="700" text-anchor="start">0.755556</text>
