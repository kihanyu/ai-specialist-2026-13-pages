<text x="320" y="206" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#475569" font-weight="700" text-anchor="middle">무관</text>
<text x="320" y="271" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">P@2</text>
<text x="320" y="305" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">0.500</text>
<text x="470" y="144" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">3위</text>
