<text x="620" y="271" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">P@4</text>
<text x="620" y="305" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">0.500</text>
<text x="770" y="144" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">5위</text>
<rect x="705" y="158" width="130" height="75" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
