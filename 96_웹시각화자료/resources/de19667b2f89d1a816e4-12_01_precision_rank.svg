<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">같은 관련 청크 3개여도 순서가 바뀌면 CP가 달라진다</title><desc id="desc">관련배열10101은 precision5=.6 CP=.755556이며 11100은precision5=.6 CP=1이다. 관련문서의앞쪽배치를측정하는CP와단순비율P는다르다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="790" fill="white"/>
<text x="40" y="52" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="32" fill="#172b4d" font-weight="700" text-anchor="start">같은 관련 청크 3개여도 순서가 바뀌면 CP가 달라진다</text>
<text x="40" y="99" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">범례: 관련 = 파란 실선 + “관련”  /  무관 = 흰 바탕 + “무관”</text>
<text x="40" y="197" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">A</text>
<text x="170" y="144" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">1위</text>
<rect x="105" y="158" width="130" height="75" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="170" y="206" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">관련</text>
<text x="170" y="271" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">P@1</text>
<text x="170" y="305" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">1.000</text>
<text x="320" y="144" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">2위</text>
