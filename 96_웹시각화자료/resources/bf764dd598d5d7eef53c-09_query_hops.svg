<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
<title id="title">질문을 바꾸는 네 방법과 순서가 필요한 다단계 검색</title>
<desc id="desc">Rewriting은 같은 의도 표현, decomposition은 여러 사실, HyDE는 가상 문서 표현, step-back은 넓은 배경 질문을 만든다. 아래는 첫 답이 다음 검색어가 되는 의존적인 multi-hop 과정이다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#617184"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<text x="40" y="55" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#17324d" text-anchor="start">질문을 바꾸는 네 방법과 순서가 필요한 다단계 검색</text>
<text x="40" y="98" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#617184" text-anchor="start">상단: 무엇을 변환하는가? · 하단: 다음 검색에 앞 단계의 답이 필요한가?</text>
<rect x="40" y="135" width="250" height="65" rx="0" fill="#edf5fc" stroke="#cad6e0" stroke-width="2"/>
<text x="60" y="177" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">방법</text>
<rect x="290" y="135" width="370" height="65" rx="0" fill="#edf5fc" stroke="#cad6e0" stroke-width="2"/>
<text x="310" y="177" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">바꾸는 대상</text>
<rect x="660" y="135" width="500" height="65" rx="0" fill="#edf5fc" stroke="#cad6e0" stroke-width="2"/>
<text x="680" y="177" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">검색에 쓸 결과 예</text>
<rect x="40" y="200" width="250" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="60" y="235" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">Rewriting</text>
<rect x="290" y="200" width="370" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="310" y="235" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">같은 의도를 검색어로</text>
<rect x="660" y="200" width="500" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="680" y="235" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">‘환불 어떻게?’</text>
<text x="680" y="269" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">→ ‘환불 신청 절차’</text>
<rect x="40" y="291" width="250" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="60" y="326" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">Decomposition</text>
<rect x="290" y="291" width="370" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="310" y="326" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">여러 사실 요구를 분리</text>
<rect x="660" y="291" width="500" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="680" y="326" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">회사 2개 × 지표 2개</text>
<text x="680" y="360" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">→ 사실별 질의 4개</text>
<rect x="40" y="382" width="250" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="60" y="417" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">HyDE</text>
<rect x="290" y="382" width="370" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="310" y="417" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">질문을 문서 같은 표현으로</text>
<rect x="660" y="382" width="500" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="680" y="417" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">가상 설명 문단 생성</text>
<text x="680" y="451" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">→ 임베딩해 실제 근거 검색</text>
<rect x="40" y="473" width="250" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="60" y="508" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">Step-Back</text>
<rect x="290" y="473" width="370" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="310" y="508" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">좁은 조건을 배경 질문으로</text>
<rect x="660" y="473" width="500" height="91" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="680" y="508" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">구체적 구매일 질문</text>
<text x="680" y="542" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">→ 보증 규정·시행 이력</text>
<text x="40" y="612" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#aa3542" text-anchor="start">가상 문서는 증거가 아니며, 넓힌 조건은 최종 답변에서 원래대로 확인한다.</text>
<rect x="40" y="650" width="1120" height="365" rx="12" fill="#edf8f5" stroke="#cad6e0" stroke-width="2"/>
<text x="65" y="693" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="start">의존적인 Multi-hop: 첫 검색의 답이 다음 검색어가 된다</text>
<text x="65" y="736" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="start">질문: A사 창업자가 세운 다른 기업의 본사 도시는?</text>
<rect x="65" y="780" width="290" height="110" rx="12" fill="white" stroke="#0d746e" stroke-width="2"/>
<text x="210.0" y="818" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">1. A사 창업자</text>
<text x="210.0" y="857" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">검색 결과: 인물 X</text>
<rect x="455" y="780" width="290" height="110" rx="12" fill="white" stroke="#0d746e" stroke-width="2"/>
<text x="600.0" y="818" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">2. X의 다른 기업</text>
<text x="600.0" y="857" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">검색 결과: 기업 B</text>
<rect x="845" y="780" width="290" height="110" rx="12" fill="white" stroke="#0d746e" stroke-width="2"/>
<text x="990.0" y="818" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">3. B의 본사</text>
<text x="990.0" y="857" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">검색 결과: 도시 Y</text>
<path d="M355,835 L447,835" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M745,835 L837,835" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="942" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">2차 검색은 1차 답을 기다려야 한다. 독립 검색처럼 동시에 실행할 수 없다.</text>
<text x="65" y="985" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="start">회사명·동명이인·시점을 검증한다. 중간 오류는 다음 검색을 오염시킨다.</text>
</svg>
