<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">충분한 근거·부분 근거·충돌은 서로 다르게 처리한다</title>
<desc id="desc">질문을 항목별로 나눈 후 근거 상태를 판단한다. 충분하고 일관하면 인용해 답하고, 일부만 확인되면 부분 답변과 보류를 분리한다. 충돌은 적용 기준으로 해결하거나 출처를 함께 표시한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#617184"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<text x="40" y="55" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#17324d" text-anchor="start">충분한 근거·부분 근거·충돌은 서로 다르게 처리한다</text>
<text x="40" y="98" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#617184" text-anchor="start">읽는 순서: 질문의 요구를 나눔 → 근거 상태 분류 → 답변·보류 방식 결정</text>
<rect x="300" y="140" width="600" height="100" rx="12" fill="#edf5fc" stroke="#2266ab" stroke-width="2"/>
<text x="600.0" y="178" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#2266ab" text-anchor="middle">질문을 항목별로 나누고 근거를 확인</text>
<text x="600.0" y="217" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">각 항목의 대상·시점·조건도 함께 비교</text>
<path d="M600,240 L600,285 L220,285 L220,325" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600,285 L600,325" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600,285 L980,285 L980,325" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="360" height="185" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="220.0" y="368" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">충분하고 일관</text>
<text x="220.0" y="407" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">근거에 따라 답변</text>
<text x="220.0" y="441" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">주장마다 인용 연결</text>
<text x="220.0" y="475" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">조건·예외를 보존</text>
<rect x="420" y="330" width="360" height="185" rx="12" fill="#fff5df" stroke="#996210" stroke-width="2"/>
<text x="600.0" y="368" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#996210" text-anchor="middle">일부 또는 전부 미확인</text>
<text x="600.0" y="407" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">확인된 항목은 답변</text>
<text x="600.0" y="441" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">나머지는 보류</text>
<text x="600.0" y="475" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">추측으로 빈칸을 메우지 않음</text>
<rect x="800" y="330" width="360" height="185" rx="12" fill="#fff0f1" stroke="#aa3542" stroke-width="2"/>
<text x="980.0" y="368" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#aa3542" text-anchor="middle">근거가 충돌</text>
<text x="980.0" y="407" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">출처·시행일·범위 확인</text>
<text x="980.0" y="441" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">공식 적용 기준을 확인</text>
<text x="980.0" y="475" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">날짜 하나로 임의 선택 금지</text>
<path d="M980,515 L980,565" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="800" y="575" width="360" height="175" rx="12" fill="white" stroke="#aa3542" stroke-width="2"/>
<text x="980.0" y="613" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#aa3542" text-anchor="middle">충돌 처리</text>
<text x="980.0" y="652" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">기준이 있으면 적용</text>
<text x="980.0" y="686" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">기준이 없으면 양쪽 표시</text>
<text x="980.0" y="720" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">확인 필요한 부분 보류</text>
<rect x="40" y="575" width="700" height="175" rx="12" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="65" y="620" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">보류는 사실의 부정이 아니다</text>
<text x="65" y="668" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#17324d" text-anchor="start">‘현재 자료에서 확인할 수 없음’과</text>
<text x="65" y="710" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#17324d" text-anchor="start">‘그 정책은 존재하지 않음’은 다른 주장이다.</text>
<rect x="40" y="800" width="1120" height="75" rx="12" fill="#fff0f1" stroke="#aa3542" stroke-width="2"/>
<text x="65" y="846" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#aa3542" text-anchor="start">잘못된 처리: V2의 7일과 V3의 14일을 평균 내어 ‘10.5일’로 답변</text>
<rect x="40" y="900" width="1120" height="105" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="65" y="941" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="start">기준이 불명확할 때: ‘V2는 7일, V3는 14일로 기록되어 있습니다.’</text>
<text x="65" y="980" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="start">‘구매 시점에 적용되는 정책을 확인해야 합니다.’</text>
</svg>
