<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">평가의 기준일에서 무엇을 아는가</title><desc id="desc">6일 종료 직후 예측한다. 관측값의 단위는 개다.. 훈련 1~6일 10 · 12 · 14 · 16 · 18 · 20 스케일 기준: 최소 10, 최대 20. 평가 7~8일 24 · 25 예측 전에는 볼 수 없는 정답. 평가 입력 · 4~6일 16 · 18 · 20 기준일에 이미 관측. 평가 라벨 · 7~8일 24 · 25 예측을 만든 뒤 비교. 훈련 예의 라벨은 6일을 넘기지 않는다.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">평가의 기준일에서 무엇을 아는가</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">6일 종료 직후 예측한다. 관측값의 단위는 개다.</text><rect x="24" y="84" width="324" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">훈련 1~6일</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">10 · 12 · 14 · 16 · 18 · 20</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">스케일 기준: 최소 10, 최대 20</text><text x="360" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="372" y="84" width="324" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="383" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">평가 7~8일</text><text x="383" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">24 · 25</text><text x="383" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예측 전에는 볼 수 없는 정답</text><rect x="24" y="170" width="324" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">평가 입력 · 4~6일</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">16 · 18 · 20</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">기준일에 이미 관측</text><text x="360" y="213" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="372" y="170" width="324" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="383" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">평가 라벨 · 7~8일</text><text x="383" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">24 · 25</text><text x="383" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예측을 만든 뒤 비교</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">훈련 예의 라벨은 6일을 넘기지 않는다.</text>
</g>
</svg>
