<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">한 노드가 이웃 메시지를 모아 다음 상태를 만든다</title><desc id="desc">자기 연결을 별도로 더하는 작은 NGCF 예. 활성화 전 스칼라를 비교한다.. 받는 u0 이전 값 2 · 차수 1 보내는 i0: 값 3 · 차수 2. i0 → u0 메시지 (3 + 2 × 3) / √2 약 6.364. u0 새 값 자기 항 2 + 6.364 약 8.364. 반대 방향 i0 ← u0 (2 + 3 × 2) / √2 ≈ 5.657 이는 i0가 받는 메시지 하나다. 전체 상태는 다른 이웃과 자기 항도 더한다.. 같은 차수 계수라도 보내는 값이 달라 메시지 값은 다르다.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">한 노드가 이웃 메시지를 모아 다음 상태를 만든다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">자기 연결을 별도로 더하는 작은 NGCF 예. 활성화 전 스칼라를 비교한다.</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">받는 u0</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">이전 값 2 · 차수 1</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">보내는 i0: 값 3 · 차수 2</text><text x="244" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">i0 → u0 메시지</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">(3 + 2 × 3) / √2</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">약 6.364</text><text x="476" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">u0 새 값</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">자기 항 2 + 6.364</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">약 8.364</text><rect x="24" y="170" width="672" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">반대 방향 i0 ← u0</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">(2 + 3 × 2) / √2 ≈ 5.657</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">이는 i0가 받는 메시지 하나다. 전체 상태는 다른 이웃과 자기 항도 더한다.</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">같은 차수 계수라도 보내는 값이 달라 메시지 값은 다르다.</text>
</g>
</svg>
