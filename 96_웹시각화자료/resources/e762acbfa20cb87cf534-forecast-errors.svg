<svg xmlns="http://www.w3.org/2000/svg" width="720" height="293" viewBox="0 0 720 293" role="img" aria-labelledby="title desc">
<title id="title">같은 예측도 오차를 모으는 방법이 다르다</title><desc id="desc">절대 오차 2개와 1개를 평균하면 1.5개다. 제곱하면 큰 오차의 영향이 커지고, 실제값 대비 비율로 비교할 수도 있다.</desc>
<rect x="1" y="1" width="718" height="291" rx="10" fill="#f8fafc" stroke="#aebfd4"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="38" text-anchor="start" font-size="24" font-weight="700" fill="#21344e">같은 예측도 오차를 모으는 방법이 다르다</text>
<text x="24" y="68" text-anchor="start" font-size="16" font-weight="400" fill="#21344e">실제값 16개·18개 · 예측값 14개·19개 · 오차 크기 2개·1개</text><rect x="24" y="84" width="672" height="47" rx="10" fill="#eaf2ff" stroke="#aebfd4"/><text x="35" y="113" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">평균 절대 오차</text><text x="225" y="113" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">2와 1을 그대로 평균</text><text x="680" y="113" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">1.50개</text><rect x="24" y="141" width="672" height="47" rx="10" fill="#e9f8f0" stroke="#aebfd4"/><text x="35" y="170" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">제곱근 평균 제곱 오차</text><text x="225" y="170" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">4와 1의 평균 → 제곱근</text><text x="680" y="170" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">약 1.58개</text><rect x="24" y="198" width="672" height="47" rx="10" fill="#fff3e6" stroke="#aebfd4"/><text x="35" y="227" text-anchor="start" font-size="16" font-weight="700" fill="#21344e">평균 절대 백분율 오차</text><text x="225" y="227" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">12.50%와 5.56%의 평균</text><text x="680" y="227" text-anchor="end" font-size="16" font-weight="700" fill="#21344e">약 9.03%</text><text x="24" y="271" text-anchor="start" font-size="15" font-weight="400" fill="#21344e">백분율은 각 오차를 해당 날짜의 실제 판매량으로 나눈 값이다.</text>
</g>
</svg>
