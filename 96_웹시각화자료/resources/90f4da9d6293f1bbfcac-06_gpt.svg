<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">GPT 전체 경로: 은닉 폭 C와 어휘 폭 V 구별</title><desc id="desc">위에서 아래로 읽는 네 단계 추적도. 모든 값은 교육용이며 실제 성능 측정이 아니다.</desc><rect width="960" height="700" fill="#f8fafc"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#142536} .title{font-size:27px;font-weight:700} .main{font-size:25px;font-weight:600} .sub{font-size:22px} .note{font-size:19px;fill:#40566b}</style>
<text x="38" y="47" class="title">GPT 전체 경로: 은닉 폭 C와 어휘 폭 V 구별</text>
<rect x="38" y="77" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="77" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="109" class="sub">① 토큰 ID → 임베딩</text>
<text x="65" y="147" class="main">[1,3] → [1,3,4]</text>
<text x="65" y="182" class="note">B=1, T=3, C=4, V=20</text>
<path d="M480 207v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="225" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="225" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="257" class="sub">② Transformer 블록 반복</text>
<text x="65" y="295" class="main">[1,3,4] → [1,3,4]</text>
<text x="65" y="330" class="note">정보를 가공하며 모양 보존</text>
<path d="M480 355v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="373" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="373" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="405" class="sub">③ LM head → 마지막 위치</text>
<text x="65" y="443" class="main">[1,3,20] → [1,20]</text>
<text x="65" y="478" class="note">C=4 특징을 V=20 후보 점수로 변환</text>
<path d="M480 503v13m-7 -7 7 7 7 -7" fill="none" stroke="#142536" stroke-width="2"/>
<rect x="38" y="521" width="884" height="127" rx="12" fill="white" stroke="#58748b" stroke-width="2"/>
<rect x="38" y="521" width="9" height="127" rx="4" fill="#2563a6"/>
<text x="65" y="553" class="sub">④ 다음 ID를 선택해 추가</text>
<text x="65" y="591" class="main">[11,4,8] → [11,4,8,2]</text>
<text x="65" y="626" class="note">T: 3 → 4 · 어휘 크기 V는 그대로</text>
<text x="38" y="686" class="note">읽는 방향: 위 → 아래 · 관계는 각 행의 설명과 화살표로 구분</text></svg>