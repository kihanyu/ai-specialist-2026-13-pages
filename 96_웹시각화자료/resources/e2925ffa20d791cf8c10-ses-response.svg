<title id="title">지수평활의 반영률이 클수록 더 빠르게 따라간다</title><desc id="desc">관측 12, 14, 16에 반영률 0.5의 최종 수준은 14.25, 0.8의 최종 수준은 15.504다. 가로축은 관측 순번, 세로축은 수준이다.</desc>
