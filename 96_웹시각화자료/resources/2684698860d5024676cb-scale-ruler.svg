<svg xmlns="http://www.w3.org/2000/svg" width="720" height="273" viewBox="0 0 720 273" role="img" aria-labelledby="title desc">
<title id="title">훈련 범위로 정한 눈금을 평가에도 쓴다</title><desc id="desc">훈련값 10과 20이 스케일에서 0과 1을 정한다. 18은 0.8이고 같은 눈금에서 평가값 24는 1.4다.</desc>
<rect x="1" y="1" width="718" height="271" rx="10" fill="#f8fafc" stroke="#aebfd4"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="38" text-anchor="start" font-size="24" font-weight="700" fill="#21344e">훈련 범위로 정한 눈금을 평가에도 쓴다</text>
<text x="24" y="69" text-anchor="start" font-size="16" font-weight="400" fill="#21344e">훈련 판매량의 최솟값과 최댓값으로 두 눈금을 연결한다.</text><path d="M82 122H648 M82 190H648" fill="none" stroke="#475569" stroke-width="2"/><path d="M112 122V190" stroke="#1552a1" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="112" cy="122" r="5" fill="#1552a1"/><circle cx="112" cy="190" r="5" fill="#1552a1"/><text x="112" y="109" text-anchor="middle" font-size="17" font-weight="700" fill="#1552a1">10개</text><text x="112" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#1552a1">0</text><path d="M400 122V190" stroke="#1552a1" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="400" cy="122" r="5" fill="#1552a1"/><circle cx="400" cy="190" r="5" fill="#1552a1"/><text x="400" y="109" text-anchor="middle" font-size="17" font-weight="700" fill="#1552a1">18개</text><text x="400" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#1552a1">0.8</text><path d="M472 122V190" stroke="#1552a1" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="472" cy="122" r="5" fill="#1552a1"/><circle cx="472" cy="190" r="5" fill="#1552a1"/><text x="472" y="109" text-anchor="middle" font-size="17" font-weight="700" fill="#1552a1">20개</text><text x="472" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#1552a1">1</text><path d="M616 122V190" stroke="#92400e" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="616" cy="122" r="5" fill="#92400e"/><circle cx="616" cy="190" r="5" fill="#92400e"/><text x="616" y="109" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">24개</text><text x="616" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">1.4</text><text x="24" y="251" text-anchor="start" font-size="16" font-weight="400" fill="#21344e">같은 눈금을 유지하면 훈련 범위 밖의 24개는 1보다 커진다.</text>
</g>
</svg>
