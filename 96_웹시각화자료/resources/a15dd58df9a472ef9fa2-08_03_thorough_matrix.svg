<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="925" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc">
<title id="title">Thorough Decoding: 모든 후보를 모든 문서에서 다시 평가</title><desc id="desc">문서별 beam에서 A B C를 얻은 뒤 후보별 모든 문서 조건 확률을 평가한다. 가중합 점수는 A .32 B .26 C .18이다. 자기 beam에 나오지 않은 항도 0이 아니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="925" fill="white"/>
<text x="40" y="52" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="32" fill="#172b4d" font-weight="700" text-anchor="start">Thorough Decoding: 모든 후보를 모든 문서에서 다시 평가</text>
<text x="40" y="98" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">① 문서별 beam으로 후보 생성 → ② 합집합 → ③ 누락된 문서-후보 점수 채우기</text>
<rect x="45" y="130" width="340" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="168" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="700" text-anchor="start">z₁ 조건 beam</text>
<text x="65" y="209" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">선택된 후보 A: 서울</text>
<path d="M215,247 L215,292" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="130" width="340" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="450" y="168" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="700" text-anchor="start">z₂ 조건 beam</text>
<text x="450" y="209" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">선택된 후보 B: 수원</text>
<path d="M600,247 L600,292" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="815" y="130" width="340" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="835" y="168" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="700" text-anchor="start">z₃ 조건 beam</text>
<text x="835" y="209" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">선택된 후보 C: 서울시</text>
<path d="M985,247 L985,292" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="305" width="1110" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="350" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="700" text-anchor="middle">후보 합집합 Y = {A, B, C}   ·   같은 토큰열만 중복 제거</text>
<text x="45" y="420" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">실선 셀: 자기 beam에서 얻은 점수    점선 셀: 빠진 조합을 재평가</text>
<text x="80" y="468" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">후보</text>
<text x="350" y="468" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">z₁ · 가중치 0.6</text>
<text x="590" y="468" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">z₂ · 가중치 0.3</text>
<text x="830" y="468" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">z₃ · 가중치 0.1</text>
<text x="1060" y="468" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">가중합</text>
<text x="65" y="535" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">A: 서울</text>
<rect x="250" y="488" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="350" y="534" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.50</text>
<rect x="490" y="488" width="200" height="72" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
<text x="590" y="534" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.05</text>
<rect x="730" y="488" width="200" height="72" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
<text x="830" y="534" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.05</text>
<rect x="970" y="488" width="180" height="72" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="1060" y="534" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#0f766e" font-weight="700" text-anchor="middle">0.320</text>
<text x="65" y="626" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">B: 수원</text>
<rect x="250" y="579" width="200" height="72" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
<text x="350" y="625" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.10</text>
<rect x="490" y="579" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="625" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.60</text>
<rect x="730" y="579" width="200" height="72" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
<text x="830" y="625" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.20</text>
<rect x="970" y="579" width="180" height="72" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="1060" y="625" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#0f766e" font-weight="700" text-anchor="middle">0.260</text>
<text x="65" y="717" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">C: 서울시</text>
<rect x="250" y="670" width="200" height="72" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
<text x="350" y="716" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.20</text>
<rect x="490" y="670" width="200" height="72" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
<text x="590" y="716" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.10</text>
<rect x="730" y="670" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="830" y="716" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#172b4d" font-weight="700" text-anchor="middle">0.30</text>
<rect x="970" y="670" width="180" height="72" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="1060" y="716" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" fill="#0f766e" font-weight="700" text-anchor="middle">0.180</text>
<text x="45" y="813" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" fill="#172b4d" font-weight="700" text-anchor="start">A: 0.6×0.50 + 0.3×0.05 + 0.1×0.05 = 0.320 → 최종 선택</text>
<text x="45" y="858" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">Fast 근사라면 빠진 조합을 0으로 둔다. 계산은 줄지만 합산 점수가 달라진다.</text>
<text x="45" y="893" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">주의: 후보 A가 z₂ beam에 없다는 사실은 p(A | x,z₂)=0이라는 뜻이 아니다.</text>
</svg>