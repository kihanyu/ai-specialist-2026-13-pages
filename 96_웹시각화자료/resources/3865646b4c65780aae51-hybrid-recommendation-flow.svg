<svg xmlns="http://www.w3.org/2000/svg" width="720" height="413" viewBox="0 0 720 413" role="img" aria-labelledby="title desc">
<title id="title">콘텐츠 점수와 협업 점수를 함께 쓰는 구조</title><desc id="desc">사용자와 후보 영화를 기준으로 콘텐츠 점수와 협업 점수를 따로 만든다. 두 점수가 있으면 같은 척도로 맞춰 섞는다. 협업 점수가 없는 신작은 콘텐츠 점수로 평가한다.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536a82"/></marker></defs>
<rect x="1" y="1" width="718" height="411" rx="11" fill="#f8fafc" stroke="#bac8d8"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#162c47">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start">콘텐츠 점수와 협업 점수를 함께 쓰는 구조</text><text x="24" y="65" font-size="15" font-weight="400" text-anchor="start">점수 결합형 혼합 추천의 예 · 같은 사용자와 같은 후보를 평가한다.</text>
<rect x="24" y="84" width="324" height="112" rx="11" fill="#e7efff" stroke="#bac8d8"/><text x="40" y="110" font-size="17" font-weight="700" text-anchor="start">콘텐츠 기반 추천</text><text x="40" y="136" font-size="15" font-weight="400" text-anchor="start">내가 좋아한 영화의 특징</text><text x="40" y="156" font-size="15" font-weight="400" text-anchor="start">↔ 후보의 장르·줄거리</text><text x="40" y="181" font-size="14" font-weight="700" text-anchor="start">출력: 취향과 얼마나 비슷한가</text><rect x="372" y="84" width="324" height="112" rx="11" fill="#e8f5ee" stroke="#bac8d8"/><text x="388" y="110" font-size="17" font-weight="700" text-anchor="start">협업 필터링</text><text x="388" y="136" font-size="15" font-weight="400" text-anchor="start">여러 사람이 남긴 시청·평점</text><text x="388" y="156" font-size="15" font-weight="400" text-anchor="start">→ 이 사용자에게 맞는 패턴</text><text x="388" y="181" font-size="14" font-weight="700" text-anchor="start">출력: 기록으로 본 예상 선호</text><path d="M186 196V210H252V226" fill="none" stroke="#536a82" stroke-width="2" marker-end="url(#arr)"/><path d="M534 196V210H468V226" fill="none" stroke="#536a82" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="226" width="672" height="56" rx="11" fill="#fff0df" stroke="#bac8d8"/><text x="39" y="248" font-size="17" font-weight="700" text-anchor="start">점수 결합: 두 점수가 있으면 같은 척도로 맞춘 뒤 섞는다</text><text x="39" y="269" font-size="15" font-weight="400" text-anchor="start">협업 점수를 낼 기록이 없는 신작은 콘텐츠 점수로 평가할 수 있다.</text><path d="M360 282V304" fill="none" stroke="#536a82" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="304" width="672" height="56" rx="11" fill="#e7efff" stroke="#bac8d8"/><text x="39" y="326" font-size="17" font-weight="700" text-anchor="start">사용자별 추천 목록</text><text x="39" y="347" font-size="15" font-weight="400" text-anchor="start">이미 본 영화를 빼고, 최종 점수가 높은 후보부터 보여 준다.</text><text x="24" y="392" font-size="14" font-weight="400" text-anchor="start">없는 점수를 0점으로 해석하지 않고, 별도의 대체 규칙을 정한다.</text>
</g></svg>
