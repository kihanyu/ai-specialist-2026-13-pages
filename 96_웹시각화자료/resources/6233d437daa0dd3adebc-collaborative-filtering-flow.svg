<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img" aria-labelledby="title desc">
<title id="title">협업 필터링만으로 영화 C의 점수를 만드는 법</title><desc id="desc">사용자 가의 평점 기록을 다른 사람과 비교한다. 영화 C의 평점을 남긴 나와 다의 4점과 5점을 각각 75%, 25% 반영하면 4.25점이다.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536a82"/></marker></defs>
<rect x="1" y="1" width="718" height="406" rx="11" fill="#f8fafc" stroke="#bac8d8"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#162c47">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start">협업 필터링만으로 영화 C의 점수를 만드는 법</text><text x="24" y="65" font-size="15" font-weight="400" text-anchor="start">사용자–사용자 방식 · 영화 장르나 줄거리는 쓰지 않는다.</text>
<rect x="24" y="83" width="672" height="56" rx="11" fill="#e7efff" stroke="#bac8d8"/><text x="39" y="105" font-size="17" font-weight="700" text-anchor="start">1. 여러 사용자의 평점 기록을 읽는다</text><text x="39" y="126" font-size="15" font-weight="400" text-anchor="start">‘가’는 A에 5점, B에 3점. 영화 C의 평점은 아직 없다.</text><path d="M360 139V159" fill="none" stroke="#536a82" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="159" width="672" height="56" rx="11" fill="#e8f5ee" stroke="#bac8d8"/><text x="39" y="181" font-size="17" font-weight="700" text-anchor="start">2. ‘가’와 기록이 비슷한 사람을 찾는다</text><text x="39" y="202" font-size="15" font-weight="400" text-anchor="start">함께 평가한 영화나 별점 패턴을 비교해 이웃을 고른다.</text><path d="M360 215V235" fill="none" stroke="#536a82" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="235" width="672" height="56" rx="11" fill="#fff0df" stroke="#bac8d8"/><text x="39" y="257" font-size="17" font-weight="700" text-anchor="start">3. 그중 C를 평가한 사람의 평점을 모은다</text><text x="39" y="278" font-size="15" font-weight="400" text-anchor="start">‘나’의 4점을 75%, ‘다’의 5점을 25% 반영한다고 가정한다.</text><path d="M360 291V311" fill="none" stroke="#536a82" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="311" width="672" height="56" rx="11" fill="#e7efff" stroke="#bac8d8"/><text x="39" y="333" font-size="17" font-weight="700" text-anchor="start">4. C의 예상 평점은 4.25점</text><text x="39" y="354" font-size="15" font-weight="400" text-anchor="start">아직 보지 않은 다른 후보도 평가하고, 점수가 높은 순으로 추천한다.</text><text x="24" y="392" font-size="14" font-weight="400" text-anchor="start">75%와 25%는 계산 흐름을 보여 주기 위해 정한 예시 비중이다.</text>
</g></svg>
