<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">공간 하한으로 건너뛰기 / 확률적으로 같은 버킷 찾기</title><desc id="desc">왼쪽: kd-tree의 정확 가지치기 / 오른쪽: 각도 LSH의 근사 후보 수집</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526175"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#172B4D} .note{fill:#526175}</style>
<rect width="1200" height="850" fill="white"/>
<text x="30" y="48.0" font-size="32" text-anchor="start" style="fill:#172B4D;font-weight:700">공간 하한으로 건너뛰기 / 확률적으로 같은 버킷 찾기</text>
<text x="30" y="92.0" font-size="24" text-anchor="start" style="fill:#526175;font-weight:400">왼쪽: kd-tree의 정확 가지치기 / 오른쪽: 각도 LSH의 근사 후보 수집</text>
<text x="35" y="150.0" font-size="26" text-anchor="start" style="fill:#0072B2;font-weight:700">kd-tree: 남은 영역의 최소 거리</text>
<rect x="70" y="305" width="170" height="170" rx="0" fill="#E8F3FA" stroke="#0072B2" stroke-width="2"/>
<rect x="325" y="305" width="170" height="170" rx="0" fill="#F8EEE9" stroke="#D55E00" stroke-width="2"/>
<text x="155" y="275.0" font-size="25" text-anchor="middle" style="fill:#0072B2;font-weight:700">R1</text>
<text x="410" y="275.0" font-size="25" text-anchor="middle" style="fill:#D55E00;font-weight:700">R2</text>
<line x1="70" y1="475" x2="520.5" y2="475" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="70" y1="475" x2="70" y2="279.5" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<text x="70" y="510.0" font-size="23" text-anchor="middle" style="fill:#172B4D;font-weight:400">0</text>
<text x="155" y="510.0" font-size="23" text-anchor="middle" style="fill:#172B4D;font-weight:400">1</text>
<text x="240" y="510.0" font-size="23" text-anchor="middle" style="fill:#172B4D;font-weight:400">2</text>
<text x="325" y="510.0" font-size="23" text-anchor="middle" style="fill:#172B4D;font-weight:400">3</text>
<text x="410" y="510.0" font-size="23" text-anchor="middle" style="fill:#172B4D;font-weight:400">4</text>
<text x="495" y="510.0" font-size="23" text-anchor="middle" style="fill:#172B4D;font-weight:400">5</text>
<text x="43" y="398.0" font-size="23" text-anchor="start" style="fill:#172B4D;font-weight:400">1</text>
<text x="43" y="313.0" font-size="23" text-anchor="start" style="fill:#172B4D;font-weight:400">2</text>
<circle cx="155" cy="390" r="8" fill="#172B4D" stroke="white" stroke-width="2"/>
<circle cx="155" cy="373.0" r="7" fill="#00856A" stroke="white" stroke-width="2"/>
<circle cx="206.0" cy="390" r="7" fill="#00856A" stroke="white" stroke-width="2"/>
<line x1="155" y1="390" x2="325" y2="390" stroke="#D55E00" stroke-width="3" stroke-dasharray="7 5"/>
<text x="80" y="550.0" font-size="23" text-anchor="start" style="fill:#172B4D;font-weight:400">q=(1,1) · A=(1,1.2) · B=(1.6,1)</text>
<text x="80" y="590.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:400">후보 거리²: A=0.04 / B=0.36</text>
<text x="80" y="630.0" font-size="24" text-anchor="start" style="fill:#D55E00;font-weight:700">R2의 하한²=4 &gt; 현재 2번째 0.36</text>
<text x="80" y="670.0" font-size="23" text-anchor="start" style="fill:#172B4D;font-weight:400">→ R2 안의 점은 검사하지 않아도 된다.</text>
<line x1="600" y1="135" x2="600" y2="720" stroke="#CFD8E3" stroke-width="2"/>
<text x="635" y="150.0" font-size="26" text-anchor="start" style="fill:#7956A5;font-weight:700">LSH: 가까워도 갈라질 수 있다</text>
<line x1="715" y1="410" x2="1110" y2="410" stroke="#CFD8E3" stroke-width="2"/>
<line x1="760" y1="445" x2="760" y2="225" stroke="#CFD8E3" stroke-width="2"/>
<line x1="700" y1="432" x2="1100" y2="286" stroke="#7956A5" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="760" y1="410" x2="1030" y2="410" stroke="#0072B2" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="760" y1="410" x2="993.8268590217984" y2="275.0" stroke="#00856A" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1080" y="442.0" font-size="24" text-anchor="middle" style="fill:#0072B2;font-weight:400">벡터 a</text>
<text x="1045" y="240.0" font-size="24" text-anchor="start" style="fill:#00856A;font-weight:400">벡터 b</text>
<text x="820" y="365.0" font-size="26" text-anchor="start" style="fill:#172B4D;font-weight:700">30°</text>
<text x="635" y="500.0" font-size="23" text-anchor="start" style="fill:#7956A5;font-weight:400">점선: 두 벡터를 가르는 한 초평면</text>
<text x="635" y="550.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:400">무작위 1비트 충돌 확률 p = 5/6</text>
<text x="635" y="590.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:400">4비트 한 테이블: p⁴ = 0.482253</text>
<text x="635" y="630.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:400">독립 테이블 3개: 1−(1−p⁴)³</text>
<text x="635" y="670.0" font-size="23" text-anchor="start" style="fill:#00856A;font-weight:700">= 0.861212 (한 번 이상 후보로 확보)</text>
<rect x="30" y="760" width="1140" height="65" rx="12" fill="#F2F6FA" stroke="#CFD8E3" stroke-width="2"/>
<text x="50" y="802.0" font-size="24" text-anchor="start" style="fill:#172B4D;font-weight:400">차이: kd-tree 하한은 안전한 배제를 증명하고, LSH는 이웃을 놓칠 확률을 허용한다.</text>
</svg>