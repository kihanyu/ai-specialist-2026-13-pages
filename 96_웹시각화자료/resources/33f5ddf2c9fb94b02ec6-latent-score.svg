<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img" aria-labelledby="title desc">
<title id="title">잠재벡터를 내적해 빈 평점을 추정한다</title><desc id="desc">관측한 평점으로 벡터를 학습한 뒤, 아직 비어 있는 칸의 점수를 구한다.. 사용자 가 u = [1, 2] 행렬 U의 한 행. 영화 C v = [0.5, 1.5] 행렬 V의 한 행. 내적 점수 1 × 0.5 + 2 × 1.5 3.5점. U는 사용자별, V는 영화별. 전체 점수 행렬은 U Vᵀ.</desc>
<rect x="1" y="1" width="718" height="212" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">잠재벡터를 내적해 빈 평점을 추정한다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">관측한 평점으로 벡터를 학습한 뒤, 아직 비어 있는 칸의 점수를 구한다.</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">사용자 가</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">u = [1, 2]</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">행렬 U의 한 행</text><text x="244" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">영화 C</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">v = [0.5, 1.5]</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">행렬 V의 한 행</text><text x="476" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">내적 점수</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">1 × 0.5 + 2 × 1.5</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">3.5점</text><text x="24" y="198" font-size="15" font-weight="700" fill="#244263" text-anchor="start">U는 사용자별, V는 영화별. 전체 점수 행렬은 U Vᵀ.</text>
</g>
</svg>
