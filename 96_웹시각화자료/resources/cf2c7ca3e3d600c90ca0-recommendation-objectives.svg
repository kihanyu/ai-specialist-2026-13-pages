<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">평점의 오차와 선호 순서는 다른 신호다</title><desc id="desc">학습하려는 출력에 맞춰 손실을 정한다.. NCF: 평점 회귀 사용자·영화 벡터 연결 → 점수 3.0 실제 평점 3.5는 실수로 보존. 제곱 오차 (3.0 − 3.5)² = 0.25 예측값을 실제값에 가깝게. NGCF: 쌍별 순위 이웃 전파 → 양성 2, 음성 1 같은 사용자 안에서 비교. BPR 손실 점수 차 +1 → 손실 약 0.313 양성 점수를 음성보다 높게. 평점 3.0과 순위 점수 2는 단위와 의미가 다르다.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">평점의 오차와 선호 순서는 다른 신호다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">학습하려는 출력에 맞춰 손실을 정한다.</text><rect x="24" y="84" width="324" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">NCF: 평점 회귀</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">사용자·영화 벡터 연결 → 점수 3.0</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">실제 평점 3.5는 실수로 보존</text><text x="360" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="372" y="84" width="324" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="383" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">제곱 오차</text><text x="383" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">(3.0 − 3.5)² = 0.25</text><text x="383" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예측값을 실제값에 가깝게</text><rect x="24" y="170" width="324" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">NGCF: 쌍별 순위</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">이웃 전파 → 양성 2, 음성 1</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">같은 사용자 안에서 비교</text><text x="360" y="213" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="372" y="170" width="324" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="383" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">BPR 손실</text><text x="383" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">점수 차 +1 → 손실 약 0.313</text><text x="383" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">양성 점수를 음성보다 높게</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">평점 3.0과 순위 점수 2는 단위와 의미가 다르다.</text>
</g>
</svg>
