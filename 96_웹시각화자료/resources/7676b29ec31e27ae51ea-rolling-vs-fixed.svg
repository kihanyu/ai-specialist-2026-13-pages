<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">둘째 날에 들어가는 값이 달라진다</title><desc id="desc">두 방식 모두 6일의 20개에서 시작해 7일에 22개를 예측한다.. 반복 한 단계 7일 예측: 20 + 2 = 22 7일 실제값이 새로 도착. 8일 예측: 26개 실제 24 + 2 = 26 최신 관측으로 입력 갱신. 고정 기준일 7일 예측: 20 + 2 = 22 7일 실제값은 아직 모름. 8일 예측: 24개 예측 22 + 2 = 24 직전 예측으로 입력 갱신. 8일을 맞히더라도 두 방식에서 사용한 정보는 다르다.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">둘째 날에 들어가는 값이 달라진다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">두 방식 모두 6일의 20개에서 시작해 7일에 22개를 예측한다.</text><rect x="24" y="84" width="324" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">반복 한 단계</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">7일 예측: 20 + 2 = 22</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">7일 실제값이 새로 도착</text><text x="360" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="372" y="84" width="324" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="383" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">8일 예측: 26개</text><text x="383" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">실제 24 + 2 = 26</text><text x="383" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">최신 관측으로 입력 갱신</text><rect x="24" y="170" width="324" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">고정 기준일</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">7일 예측: 20 + 2 = 22</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">7일 실제값은 아직 모름</text><text x="360" y="213" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="372" y="170" width="324" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="383" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">8일 예측: 24개</text><text x="383" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">예측 22 + 2 = 24</text><text x="383" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">직전 예측으로 입력 갱신</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">8일을 맞히더라도 두 방식에서 사용한 정보는 다르다.</text>
</g>
</svg>
