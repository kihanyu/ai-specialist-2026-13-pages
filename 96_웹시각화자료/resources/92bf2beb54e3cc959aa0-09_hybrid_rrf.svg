<text x="812.5" y="709" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">0.015873</text>
<rect x="970" y="670" width="190" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="1065.0" y="709" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">4</text>
<text x="40" y="777" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#617184" text-anchor="start">네 문서 사이 상대 순위. 전체 순위는 생략 문서도 계산한다.</text>
<rect x="40" y="825" width="330" height="120" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="205.0" y="863" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">RRF Top-20</text>
<text x="205.0" y="902" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">후보를 추림</text>
<rect x="435" y="825" width="330" height="120" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="600.0" y="863" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">Rerank 20쌍</text>
<text x="600.0" y="902" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">질문·청크를 함께 평가</text>
<rect x="830" y="825" width="330" height="120" rx="12" fill="#edf8f5" stroke="#0d746e" stroke-width="2"/>
<text x="995.0" y="863" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" fill="#0d746e" text-anchor="middle">근거 Top-4</text>
<text x="995.0" y="902" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#17324d" text-anchor="middle">중복·길이·조건 확인</text>
<path d="M370,885 L427,885" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M765,885 L822,885" fill="none" stroke="#617184" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="1005" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="400" fill="#aa3542" text-anchor="start">주의: 후보 밖 정답은 reranker가 복구하지 못한다.</text>
</svg>
