<text x="560.0" y="529" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">1</text>
<rect x="655" y="490" width="315" height="60" rx="0" fill="#edf8f5" stroke="#cad6e0" stroke-width="2"/>
<text x="812.5" y="529" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">0.032522</text>
<rect x="970" y="490" width="190" height="60" rx="0" fill="#edf8f5" stroke="#cad6e0" stroke-width="2"/>
<text x="1065.0" y="529" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">1</text>
