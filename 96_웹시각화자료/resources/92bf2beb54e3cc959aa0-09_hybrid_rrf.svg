<text x="560.0" y="589" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">5</text>
<rect x="655" y="550" width="315" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="812.5" y="589" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">0.031778</text>
<rect x="970" y="550" width="190" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="1065.0" y="589" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">2</text>
<rect x="40" y="610" width="235" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="157.5" y="649" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">C: 결제 수단</text>
<rect x="275" y="610" width="190" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="370.0" y="649" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">8</text>
<rect x="465" y="610" width="190" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="560.0" y="649" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">2</text>
<rect x="655" y="610" width="315" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="812.5" y="649" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">0.030835</text>
<rect x="970" y="610" width="190" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="1065.0" y="649" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">3</text>
<rect x="40" y="670" width="235" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
<text x="157.5" y="709" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">D: 쿠폰 안내</text>
<rect x="275" y="670" width="190" height="60" rx="0" fill="white" stroke="#cad6e0" stroke-width="2"/>
