<text x="1065.0" y="469" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#17324d" text-anchor="middle">표 안 순위</text>
<rect x="40" y="490" width="235" height="60" rx="0" fill="#edf8f5" stroke="#cad6e0" stroke-width="2"/>
<text x="157.5" y="529" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">A: 환불 정책</text>
<rect x="275" y="490" width="190" height="60" rx="0" fill="#edf8f5" stroke="#cad6e0" stroke-width="2"/>
<text x="370.0" y="529" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle">2</text>
