<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" role="img" aria-labelledby="t d"><title id="t">윈도우가 길어지면 한 예에 담는 과거가 늘어난다</title><desc id="d">훈련 관측 6개와 미래 라벨 2개에서 입력 크기 2는 3쌍, 크기 3은 2쌍, 크기 4는 1쌍을 만든다.</desc><rect x="1" y="1" width="718" height="294" rx="10" fill="#f8fafc" stroke="#b9c9db"/><g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#19334f"><text x="24" y="38" font-size="24" font-weight="700">윈도우가 길어지면 한 예에 담는 과거가 늘어난다</text><text x="24" y="65" font-size="15" font-weight="400">훈련 관측: 10 · 12 · 14 · 16 · 18 · 20개 / 예측 길이: 2개</text><rect x="24" y="82" width="672" height="51" rx="10" fill="#e7efff" stroke="#b9c9db"/><text x="38" y="113" font-size="16" font-weight="700">입력 2개</text><text x="163" y="103" font-size="15" font-weight="400">첫 예 [10, 12] → 라벨 [14, 16]</text><text x="163" y="123" font-size="14" font-weight="400">시작 위치 1·2·3 → 3쌍</text><rect x="24" y="142" width="672" height="51" rx="10" fill="#e8f6ef" stroke="#b9c9db"/><text x="38" y="173" font-size="16" font-weight="700">입력 3개</text><text x="163" y="163" font-size="15" font-weight="400">첫 예 [10, 12, 14] → 라벨 [16, 18]</text><text x="163" y="183" font-size="14" font-weight="400">시작 위치 1·2 → 2쌍</text><rect x="24" y="202" width="672" height="51" rx="10" fill="#fff0df" stroke="#b9c9db"/><text x="38" y="233" font-size="16" font-weight="700">입력 4개</text><text x="163" y="223" font-size="15" font-weight="400">첫 예 [10, 12, 14, 16] → 라벨 [18, 20]</text><text x="163" y="243" font-size="14" font-weight="400">시작 위치 1 → 1쌍</text><text x="24" y="281" font-size="15" font-weight="700">더 많은 과거를 보는 것과 더 많은 학습 예를 만드는 것은 다르다.</text></g></svg>
