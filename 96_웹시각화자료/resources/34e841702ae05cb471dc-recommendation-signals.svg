<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img" aria-labelledby="title desc">
<title id="title">추천의 근거는 속성 또는 상호작용이다</title><desc id="desc">사용자가 본 영화와 아직 보지 않은 후보가 주어졌다.. 콘텐츠 기반 좋아한 영화 → 장르 프로필 후보의 장르와 비교. 협업 필터링 평점·클릭 기록 비교 다른 사용자의 기록에서 단서. 혼합 방식 장르와 행동 기록을 결합 두 종류의 근거를 함께 사용. 미관측은 0점이 아니다. 아직 노출되지 않았을 수도 있다.</desc>
<rect x="1" y="1" width="718" height="212" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">추천의 근거는 속성 또는 상호작용이다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">사용자가 본 영화와 아직 보지 않은 후보가 주어졌다.</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">콘텐츠 기반</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">좋아한 영화 → 장르 프로필</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">후보의 장르와 비교</text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">협업 필터링</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">평점·클릭 기록 비교</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">다른 사용자의 기록에서 단서</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">혼합 방식</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">장르와 행동 기록을 결합</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">두 종류의 근거를 함께 사용</text><text x="24" y="198" font-size="15" font-weight="700" fill="#244263" text-anchor="start">미관측은 0점이 아니다. 아직 노출되지 않았을 수도 있다.</text>
</g>
</svg>
