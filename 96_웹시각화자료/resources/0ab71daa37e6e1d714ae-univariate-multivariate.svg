<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-labelledby="t d"><title id="t">입력 변수가 늘어나도 출력은 판매량 하나일 수 있다</title><desc id="d">단변량 입력은 판매량 하나, 다변량 입력은 판매량과 방문자 수와 광고비다. 둘 다 다음 날 판매량만 예측할 수 있다.</desc><rect x="1" y="1" width="718" height="302" rx="10" fill="#f8fafc" stroke="#b9c9db"/><g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#19334f"><text x="24" y="38" font-size="24" font-weight="700">입력 변수가 늘어나도 출력은 판매량 하나일 수 있다</text><text x="24" y="65" font-size="15" font-weight="400">어제까지 관측한 값으로 오늘 판매량을 예측하는 두 설계</text><rect x="24" y="83" width="324" height="157" rx="10" fill="#e7efff" stroke="#b9c9db"/><rect x="372" y="83" width="324" height="157" rx="10" fill="#e8f6ef" stroke="#b9c9db"/><text x="40" y="110" font-size="19" font-weight="700">단변량 입력</text><text x="40" y="139" font-size="16" font-weight="400">각 날짜: 판매량 한 열</text><text x="40" y="169" font-size="16" font-weight="400">20개 → 32개 → 24개</text><text x="40" y="198" font-size="18" font-weight="700">↓</text><text x="40" y="225" font-size="17" font-weight="700">출력: 오늘 판매량 하나</text><text x="388" y="110" font-size="19" font-weight="700">다변량 입력</text><text x="388" y="139" font-size="15" font-weight="400">각 날짜: 판매량·방문자 수·광고비</text><text x="388" y="169" font-size="16" font-weight="400">날짜마다 세 열을 함께 읽는다.</text><text x="388" y="198" font-size="18" font-weight="700">↓</text><text x="388" y="225" font-size="17" font-weight="700">출력: 오늘 판매량 하나</text><text x="24" y="275" font-size="15" font-weight="700">시간이 같은 행끼리 맞추고, 예측 시점에 아는 값만 입력한다.</text></g></svg>
