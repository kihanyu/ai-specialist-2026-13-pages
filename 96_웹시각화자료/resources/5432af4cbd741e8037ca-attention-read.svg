<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">질의가 바뀌면 같은 과거의 문맥이 바뀐다</title><desc id="desc">인코더 상태 [0, 2]는 고정한다. 문맥은 상태의 가중평균이다.. 질의 q = 1 내적 점수 [0, 2] 뒤 상태의 점수가 더 높음. softmax 가중치 [0.119, 0.881] 합계 1. 문맥 0 × 0.119 + 2 × 0.881 약 1.762. 질의 q = 0 내적 점수 [0, 0] 두 점수가 같음. softmax 가중치 [0.5, 0.5] 합계 1. 문맥 0 × 0.5 + 2 × 0.5 1. 양수이고 합이 1인 것은 점수가 아니라 softmax 이후의 가중치다.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">질의가 바뀌면 같은 과거의 문맥이 바뀐다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">인코더 상태 [0, 2]는 고정한다. 문맥은 상태의 가중평균이다.</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">질의 q = 1</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">내적 점수 [0, 2]</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">뒤 상태의 점수가 더 높음</text><text x="244" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">softmax 가중치</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">[0.119, 0.881]</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">합계 1</text><text x="476" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">문맥</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">0 × 0.119 + 2 × 0.881</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">약 1.762</text><rect x="24" y="170" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">질의 q = 0</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">내적 점수 [0, 0]</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">두 점수가 같음</text><text x="244" y="213" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="256" y="170" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">softmax 가중치</text><text x="267" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">[0.5, 0.5]</text><text x="267" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">합계 1</text><text x="476" y="213" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="488" y="170" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">문맥</text><text x="499" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">0 × 0.5 + 2 × 0.5</text><text x="499" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">1</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">양수이고 합이 1인 것은 점수가 아니라 softmax 이후의 가중치다.</text>
</g>
</svg>
