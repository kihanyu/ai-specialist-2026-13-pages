<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">배치 축을 유지한 채 마지막 시점을 고른다</title><desc id="desc">예 2개 · 관측 길이 3 · 시점당 특성 1개 · 은닉 폭 4. 입력 [2, 3, 1] 예 × 시간 × 특성. LSTM 표현 [2, 3, 4] 예 × 시간 × 은닉. 예측 두 개 [2] 마지막 상태를 숫자로. 예측 [17, 19] 첫 예 17 · 둘째 예 19 예측 모양: [2]. 정답 [16, 20] 첫 예 16 · 둘째 예 20 정답 모양: [2]. MSE = 1 (1² + (−1)²) / 2 같은 예끼리 비교. 폭 2 합성곱은 시간 길이가 2지만 마지막 위치를 고르는 목적은 같다.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="37" font-size="24" font-weight="700" fill="#102341" text-anchor="start">배치 축을 유지한 채 마지막 시점을 고른다</text>
<text x="24" y="65" font-size="16" font-weight="400" fill="#20314b" text-anchor="start">예 2개 · 관측 길이 3 · 시점당 특성 1개 · 은닉 폭 4</text><rect x="24" y="84" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">입력</text><text x="35" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">[2, 3, 1]</text><text x="35" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예 × 시간 × 특성</text><text x="244" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="256" y="84" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">LSTM 표현</text><text x="267" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">[2, 3, 4]</text><text x="267" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예 × 시간 × 은닉</text><text x="476" y="127" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="488" y="84" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="106" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">예측 두 개</text><text x="499" y="128" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">[2]</text><text x="499" y="147" font-size="14" font-weight="400" fill="#425776" text-anchor="start">마지막 상태를 숫자로</text><rect x="24" y="170" width="208" height="74" rx="12" fill="#e6efff" stroke="#93b4e6"/><text x="35" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">예측 [17, 19]</text><text x="35" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">첫 예 17 · 둘째 예 19</text><text x="35" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">예측 모양: [2]</text><text x="244" y="213" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="256" y="170" width="208" height="74" rx="12" fill="#e4f6ef" stroke="#83bca9"/><text x="267" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">정답 [16, 20]</text><text x="267" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">첫 예 16 · 둘째 예 20</text><text x="267" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">정답 모양: [2]</text><text x="476" y="213" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">→</text><rect x="488" y="170" width="208" height="74" rx="12" fill="#fff0dc" stroke="#d9ae71"/><text x="499" y="192" font-size="17" font-weight="700" fill="#20314b" text-anchor="start">MSE = 1</text><text x="499" y="214" font-size="15" font-weight="400" fill="#20314b" text-anchor="start">(1² + (−1)²) / 2</text><text x="499" y="233" font-size="14" font-weight="400" fill="#425776" text-anchor="start">같은 예끼리 비교</text><text x="24" y="284" font-size="15" font-weight="700" fill="#244263" text-anchor="start">폭 2 합성곱은 시간 길이가 2지만 마지막 위치를 고르는 목적은 같다.</text>
</g>
</svg>
