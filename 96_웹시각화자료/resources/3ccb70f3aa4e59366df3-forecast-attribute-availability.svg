<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" aria-labelledby="t d"><title id="t">추가 특성은 예측하는 순간을 기준으로 고른다</title><desc id="d">일요일 밤에는 과거 관측과 월요일 행사 일정, 당시 발표된 날씨 예보를 쓸 수 있다. 월요일 실제 강수량은 미래에야 관측하므로 입력에 넣지 않는다.</desc><rect x="1" y="1" width="718" height="303" rx="10" fill="#f8fafc" stroke="#b9c8d9"/><g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#19334f"><text x="24" y="38" font-size="24" font-weight="700">추가 특성은 예측하는 순간을 기준으로 고른다</text><text x="24" y="65" font-size="16" font-weight="400">예측 시점: 일요일 영업 종료 / 목표: 월요일 판매량</text><rect x="24" y="85" width="324" height="142" rx="10" fill="#e7f5ee" stroke="#b9c8d9"/><text x="40" y="112" font-size="19" font-weight="700">쓸 수 있는 정보</text><text x="40" y="141" font-size="15" font-weight="400">일요일까지 관측한 판매량·날씨</text><text x="40" y="169" font-size="15" font-weight="400">미리 정해진 월요일 행사·공휴일</text><text x="40" y="197" font-size="15" font-weight="400">일요일에 발표된 월요일 날씨 예보</text><rect x="372" y="85" width="324" height="142" rx="10" fill="#fff0df" stroke="#b9c8d9"/><text x="388" y="112" font-size="19" font-weight="700">아직 쓸 수 없는 정보</text><text x="388" y="141" font-size="16" font-weight="400">월요일의 실제 강수량</text><text x="388" y="169" font-size="16" font-weight="400">월요일의 실제 판매량</text><text x="388" y="197" font-size="15" font-weight="400">→ 월요일이 지나야 관측된다.</text><text x="24" y="261" font-size="16" font-weight="700">요일과 행사는 미래 날짜의 정보라도 미리 알 수 있다.</text><text x="24" y="286" font-size="15" font-weight="400">평가에서도 실제 운영과 같은 정보 조건을 유지한다.</text></g></svg>
