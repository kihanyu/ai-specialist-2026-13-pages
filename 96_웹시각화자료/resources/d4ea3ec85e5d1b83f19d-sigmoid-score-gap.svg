7.00V253" stroke="#8099b6" stroke-dasharray="3 3"/><circle cx="435" cy="147.00" r="5" fill="#a34b19"/><text x="425" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#873b15">약 0.73</text><text x="435" y="275" font-size="14" font-weight="700" text-anchor="middle" fill="#19334d">1</text><text x="25" y="93" font-size="14" font-weight="700" text-anchor="start" fill="#19334d">시그모이드 출력</text><text x="638" y="302" font-size="15" font-weight="700" text-anchor="end" fill="#19334d">점수 차이 (본 영화 − 비교 후보)</text><text x="24" y="327" font-size="15" font-weight="400" text-anchor="start" fill="#19334d">동점이면 0.5다. 본 영화가 앞설수록 출력이 1에 가까워진다.</text>
