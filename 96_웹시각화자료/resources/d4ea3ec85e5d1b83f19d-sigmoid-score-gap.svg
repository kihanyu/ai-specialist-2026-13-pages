<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-labelledby="title desc">
<title id="title">두 영화의 점수 차이를 시그모이드로 읽는다</title><desc id="desc">차이가 -1, 0, 1이면 출력은 약 0.27, 0.50, 0.73이다. 함수는 점수 차이의 순서를 보존하며 0과 1 사이 값으로 바꾼다.</desc>
<rect x="1" y="1" width="718" height="343" rx="10" fill="#f8fafc" stroke="#bdcadb"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#19334d">두 영화의 점수 차이를 시그모이드로 읽는다</text><text x="24" y="65" font-size="15" font-weight="400" text-anchor="start" fill="#19334d">같은 사용자에서 본 영화 점수와 아직 보지 않은 후보 점수를 비교한다.</text>
<path d="M110 108H630 M110 180.5H630 M110 253H630" stroke="#d2ddec" stroke-dasharray="5 4"/>
<path d="M110 100V253H640" fill="none" stroke="#526983" stroke-width="2"/>
