<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">문서별 경로를 곱한 뒤, 같은 답변의 가능성을 합한다</title><desc id="desc">정답 서울에 대해 문서 사전확률 .6 .3 .1과 생성확률 .5 .05 .05를 곱하면 .3 .015 .005이며 합은 .32이다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="730" fill="white"/>
<text x="40" y="52" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="32" fill="#172b4d" font-weight="700" text-anchor="start">문서별 경로를 곱한 뒤, 같은 답변의 가능성을 합한다</text>
<text x="40" y="98" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#475569" font-weight="400" text-anchor="start">질문 x: A사의 창립 도시는?    고정 답변 y: 서울</text>
<text x="65" y="147" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">① 문서 선택 확률</text>
<text x="440" y="147" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">② 그 문서에서 정답 생성</text>
<text x="895" y="147" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">③ 경로의 기여</text>
<rect x="45" y="177" width="265" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="215" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">z₁  문서 확률</text>
<text x="70" y="250" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start">0.6</text>
<path d="M320,223 L415,223" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="347" y="205" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#172b4d" font-weight="400" text-anchor="start">×</text>
<rect x="430" y="177" width="360" height="92" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="455" y="215" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">p(서울 | x, z₁)</text>
<text x="455" y="250" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#0f766e" font-weight="700" text-anchor="start">0.50</text>
<path d="M800,223 L880,223" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="895" y="177" width="255" height="92" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="1022" y="237" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="30" fill="#b45309" font-weight="700" text-anchor="middle">0.300</text>
<rect x="45" y="297" width="265" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="335" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">z₂  문서 확률</text>
<text x="70" y="370" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start">0.3</text>
<path d="M320,343 L415,343" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="347" y="325" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#172b4d" font-weight="400" text-anchor="start">×</text>
<rect x="430" y="297" width="360" height="92" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="455" y="335" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">p(서울 | x, z₂)</text>
<text x="455" y="370" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#0f766e" font-weight="700" text-anchor="start">0.05</text>
<path d="M800,343 L880,343" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="895" y="297" width="255" height="92" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="1022" y="357" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="30" fill="#b45309" font-weight="700" text-anchor="middle">0.015</text>
<rect x="45" y="417" width="265" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="455" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">z₃  문서 확률</text>
<text x="70" y="490" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start">0.1</text>
<path d="M320,463 L415,463" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="347" y="445" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#172b4d" font-weight="400" text-anchor="start">×</text>
<rect x="430" y="417" width="360" height="92" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="455" y="455" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">p(서울 | x, z₃)</text>
<text x="455" y="490" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#0f766e" font-weight="700" text-anchor="start">0.05</text>
<path d="M800,463 L880,463" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="895" y="417" width="255" height="92" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="1022" y="477" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="30" fill="#b45309" font-weight="700" text-anchor="middle">0.005</text>
<rect x="45" y="562" width="1105" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="600" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">최종 가능도: 0.300 + 0.015 + 0.005 = 0.320</text>
<text x="70" y="635" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" fill="#172b4d" font-weight="400" text-anchor="start">학습 손실: −ln(0.32) ≈ 1.139434</text>
<text x="45" y="699" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" fill="#475569" font-weight="400" text-anchor="start">주의: 문서 텍스트를 합치는 그림이 아니다. 문서별 확률 경로를 합산한다.</text>
</svg>